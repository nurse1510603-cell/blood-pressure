<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老大人血壓守護幫手 - 多長輩切換與家人遠端同步</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for high legibility -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4fbf7;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        .crisis-pulse {
            animation: pulse-border 1.2s infinite alternate;
        }
        @keyframes pulse-border {
            0% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            100% { border-color: #facc15; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
        /* Custom scrollbar for easy touch scroll */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen pb-28 select-none">

    <!-- Header / Navbar -->
    <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-emerald-800 p-2 rounded-2xl shadow text-2xl font-black">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wide">血壓記錄隨手記</h1>
                    <p class="text-xs text-emerald-200">長輩字體大 ‧ 家人隨時看 ‧ 看診報表</p>
                </div>
            </div>
            <!-- Sync Indicator -->
            <div id="sync-badge" class="bg-emerald-900/80 border border-emerald-500 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-bold flex items-center space-x-1">
                <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-ping"></span>
                <span id="sync-text">連線中</span>
            </div>
        </div>

        <!-- Elderly Profile Switcher Bar -->
        <div class="bg-emerald-900 border-t border-emerald-700/60 px-4 py-2.5">
            <div class="max-w-md mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-user-circle text-2xl text-emerald-300"></i>
                    <span class="text-sm text-emerald-200 font-bold">目前長輩：</span>
                    <select id="user-select-bar" onchange="switchActiveUser(this.value)" class="bg-emerald-950 text-amber-300 font-black text-lg py-1 px-3 rounded-xl border-2 border-emerald-400 focus:outline-none">
                        <!-- Dynamic user options -->
                    </select>
                </div>
                <button onclick="openUserModal()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-900 font-black text-xs py-1.5 px-3 rounded-xl shadow flex items-center space-x-1 border border-amber-300">
                    <i class="fa-solid fa-users-gear"></i>
                    <span>新增/改名</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Emergency Crisis Banner -->
        <div id="crisis-banner" class="hidden mb-4 bg-red-600 text-white p-4 rounded-3xl shadow-xl border-4 crisis-pulse">
            <div class="flex items-start space-x-3">
                <div class="text-3xl text-yellow-300"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div>
                    <h3 class="text-xl font-black text-yellow-200">【危急警示】血壓數值過高！</h3>
                    <p class="text-base mt-1 text-white font-bold" id="crisis-msg">收縮壓超過180或舒張壓超過120，請聯繫家人或前往就醫！</p>
                </div>
            </div>
        </div>

        <!-- TAB 1: 輸入紀錄 (Input Record) -->
        <section id="tab-record" class="space-y-4">
            <div class="bg-white rounded-3xl shadow-md p-5 border-2 border-emerald-100">
                
                <!-- Current Selected User Banner -->
                <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3.5 mb-4 flex items-center justify-between shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-500 text-white text-xl w-10 h-10 rounded-full flex items-center justify-center font-black">
                            <i class="fa-solid fa-user-heart"></i>
                        </div>
                        <div>
                            <span class="text-xs text-amber-800 font-bold block">紀錄對象</span>
                            <span id="active-user-name" class="text-2xl text-slate-900 font-black">王爺爺</span>
                        </div>
                    </div>
                    <button type="button" onclick="openUserModal()" class="bg-white text-amber-900 font-bold text-sm px-3 py-1.5 rounded-xl border border-amber-300 shadow-sm active:scale-95">
                        切換長輩
                    </button>
                </div>

                <form id="bp-form" onsubmit="handleFormSubmit(event)" class="space-y-5">
                    
                    <!-- Date Input -->
                    <div>
                        <label class="block text-base font-bold text-slate-700 mb-1">1. 選擇量測日期</label>
                        <input type="date" id="record-date" required
                            class="w-full text-xl p-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:border-emerald-600 focus:outline-none font-black text-slate-900">
                    </div>

                    <!-- Time Slot Toggle (722 standard Morning/Evening) -->
                    <div>
                        <label class="block text-base font-bold text-slate-700 mb-1">2. 選擇時段 (早晨 / 晚間)</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button type="button" onclick="setTimeSlot('早晨 Morning')" id="btn-morning"
                                class="py-3.5 px-3 rounded-2xl font-black text-xl flex items-center justify-center space-x-2 border-2 transition-all bg-amber-500 text-white border-amber-600 shadow">
                                <i class="fa-solid fa-sun text-2xl"></i>
                                <span>早晨 (起床)</span>
                            </button>
                            <button type="button" onclick="setTimeSlot('晚間 Evening')" id="btn-evening"
                                class="py-3.5 px-3 rounded-2xl font-black text-xl flex items-center justify-center space-x-2 border-2 transition-all bg-slate-100 text-slate-700 border-slate-300">
                                <i class="fa-solid fa-moon text-2xl"></i>
                                <span>晚間 (睡前)</span>
                            </button>
                        </div>
                    </div>

                    <!-- SYS & DIA Stepper + Big Keypad Display Box -->
                    <div class="grid grid-cols-2 gap-3">
                        
                        <!-- SYS Input Box -->
                        <div class="bg-red-50 p-3.5 rounded-2xl border-2 border-red-200 flex flex-col items-center">
                            <label class="block text-center text-sm font-bold text-red-900 mb-1">收縮壓 SYS <span class="text-xs font-normal block">(高壓 mmHg)</span></label>
                            
                            <!-- Top + Step -->
                            <button type="button" onclick="stepValue('sys', 1)" class="w-full bg-red-600 active:bg-red-700 text-white font-black text-2xl py-2 rounded-xl shadow mb-2 flex items-center justify-center space-x-1 active:scale-95">
                                <i class="fa-solid fa-plus"></i> <span class="text-sm font-bold">+1</span>
                            </button>
                            
                            <!-- Big Touch Display -> Triggers Keypad -->
                            <div onclick="openKeypad('sys')" class="w-full bg-white border-4 border-red-400 rounded-2xl py-3 px-1 text-center cursor-pointer shadow-inner hover:border-red-600 active:bg-red-100 transition-all">
                                <span id="sys-display" class="text-4xl font-black text-red-600 tracking-wider">120</span>
                                <span class="block text-xs text-slate-400 font-bold mt-1"><i class="fa-solid fa-keyboard mr-1"></i>按此點擊大鍵盤</span>
                            </div>
                            
                            <!-- Bottom - Step -->
                            <button type="button" onclick="stepValue('sys', -1)" class="w-full bg-white active:bg-red-100 text-red-700 font-black text-2xl py-2 rounded-xl shadow border border-red-300 mt-2 flex items-center justify-center space-x-1 active:scale-95">
                                <i class="fa-solid fa-minus"></i> <span class="text-sm font-bold">-1</span>
                            </button>
                        </div>

                        <!-- DIA Input Box -->
                        <div class="bg-blue-50 p-3.5 rounded-2xl border-2 border-blue-200 flex flex-col items-center">
                            <label class="block text-center text-sm font-bold text-blue-900 mb-1">舒張壓 DIA <span class="text-xs font-normal block">(低壓 mmHg)</span></label>
                            
                            <!-- Top + Step -->
                            <button type="button" onclick="stepValue('dia', 1)" class="w-full bg-blue-600 active:bg-blue-700 text-white font-black text-2xl py-2 rounded-xl shadow mb-2 flex items-center justify-center space-x-1 active:scale-95">
                                <i class="fa-solid fa-plus"></i> <span class="text-sm font-bold">+1</span>
                            </button>
                            
                            <!-- Big Touch Display -> Triggers Keypad -->
                            <div onclick="openKeypad('dia')" class="w-full bg-white border-4 border-blue-400 rounded-2xl py-3 px-1 text-center cursor-pointer shadow-inner hover:border-blue-600 active:bg-blue-100 transition-all">
                                <span id="dia-display" class="text-4xl font-black text-blue-600 tracking-wider">80</span>
                                <span class="block text-xs text-slate-400 font-bold mt-1"><i class="fa-solid fa-keyboard mr-1"></i>按此點擊大鍵盤</span>
                            </div>
                            
                            <!-- Bottom - Step -->
                            <button type="button" onclick="stepValue('dia', -1)" class="w-full bg-white active:bg-blue-100 text-blue-700 font-black text-2xl py-2 rounded-xl shadow border border-blue-300 mt-2 flex items-center justify-center space-x-1 active:scale-95">
                                <i class="fa-solid fa-minus"></i> <span class="text-sm font-bold">-1</span>
                            </button>
                        </div>
                    </div>

                    <!-- Hidden Inputs for actual numeric storage -->
                    <input type="hidden" id="sys-input" value="120">
                    <input type="hidden" id="dia-input" value="80">
                    <input type="hidden" id="pulse-input" value="75">

                    <!-- Pulse Input -->
                    <div class="bg-purple-50 p-3.5 rounded-2xl border-2 border-purple-200">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-base font-bold text-purple-900">3. 脈搏 Pulse <span class="text-xs font-normal">(次/分)</span></label>
                            <button type="button" onclick="openKeypad('pulse')" class="text-xs font-bold bg-purple-600 text-white px-3 py-1 rounded-lg">大鍵盤輸入</button>
                        </div>
                        <div onclick="openKeypad('pulse')" class="bg-white border-2 border-purple-300 rounded-xl p-3 text-center cursor-pointer">
                            <span id="pulse-display" class="text-3xl font-black text-purple-700">75</span>
                        </div>
                    </div>

                    <!-- Quick Memo Buttons -->
                    <div>
                        <label class="block text-base font-bold text-slate-700 mb-2">4. 點選或輸入紀錄備忘</label>
                        <div class="flex flex-wrap gap-2 mb-2">
                            <button type="button" onclick="appendTag('💊服藥前')" class="bg-slate-100 hover:bg-emerald-100 active:bg-emerald-200 text-slate-800 text-sm font-bold py-2 px-3 rounded-xl border border-slate-300">💊 服藥前</button>
                            <button type="button" onclick="appendTag('💊服藥後')" class="bg-slate-100 hover:bg-emerald-100 active:bg-emerald-200 text-slate-800 text-sm font-bold py-2 px-3 rounded-xl border border-slate-300">💊 服藥後</button>
                            <button type="button" onclick="appendTag('😊心情平穩')" class="bg-slate-100 hover:bg-emerald-100 active:bg-emerald-200 text-slate-800 text-sm font-bold py-2 px-3 rounded-xl border border-slate-300">😊 心情平穩</button>
                            <button type="button" onclick="appendTag('🌀身體稍暈')" class="bg-slate-100 hover:bg-emerald-100 active:bg-emerald-200 text-slate-800 text-sm font-bold py-2 px-3 rounded-xl border border-slate-300">🌀 身體稍暈</button>
                        </div>
                        <input type="text" id="memo-input" placeholder="可點按上方快捷鈕或輸入備忘..."
                            class="w-full text-base p-3 bg-slate-50 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-emerald-600 font-bold">
                    </div>

                    <!-- Photo Upload for BP Screen -->
                    <div class="bg-slate-50 p-3.5 rounded-2xl border-2 border-dashed border-slate-300">
                        <label class="block text-base font-bold text-slate-700 mb-1 flex items-center justify-between">
                            <span>📸 拍照上傳血壓計畫面 (選填)</span>
                        </label>
                        <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)"
                            class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-emerald-600 file:text-white cursor-pointer">
                        
                        <div id="photo-preview-container" class="mt-3 hidden relative">
                            <img id="photo-preview" src="" alt="血壓計相片" class="w-full h-44 object-cover rounded-xl border-2 border-emerald-400">
                            <button type="button" onclick="removePhoto()" class="absolute top-2 right-2 bg-red-600 text-white w-8 h-8 rounded-full font-bold shadow-lg flex items-center justify-center">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="w-full bg-emerald-600 active:bg-emerald-700 text-white text-2xl font-black py-4 px-6 rounded-2xl shadow-xl transition-all flex items-center justify-center space-x-2 border-b-4 border-emerald-800">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>儲存血壓資料 (同步雲端)</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- TAB 2: 歷史紀錄與圖表 (History & Chart) -->
        <section id="tab-history" class="space-y-4 hidden">
            <!-- Line Chart Card -->
            <div class="bg-white rounded-3xl shadow-md p-4 border-2 border-emerald-100">
                <h2 class="text-xl font-black text-emerald-900 mb-2 flex items-center">
                    <i class="fa-solid fa-chart-line text-emerald-600 mr-2"></i> 最近 14 次測量趨勢
                </h2>
                <div class="relative w-full h-56 bg-slate-50 rounded-2xl p-2 border border-slate-200">
                    <canvas id="bpChart"></canvas>
                </div>
            </div>

            <!-- Record List -->
            <div class="bg-white rounded-3xl shadow-md p-4 border-2 border-emerald-100">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xl font-black text-emerald-900 flex items-center">
                        <i class="fa-solid fa-list-check text-emerald-600 mr-2"></i> 歷史紀錄明細
                    </h2>
                    <span id="record-count" class="bg-emerald-100 text-emerald-900 text-xs font-black px-2.5 py-1 rounded-full">0 筆</span>
                </div>
                <div id="records-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <!-- Dynamic Record Cards -->
                </div>
            </div>
        </section>

        <!-- TAB 3: 醫師門診報表 (Doctor Report) -->
        <section id="tab-doctor" class="space-y-4 hidden">
            <div class="bg-white rounded-3xl shadow-md p-5 border-2 border-emerald-100">
                <h2 class="text-xl font-black text-emerald-900 mb-2 flex items-center">
                    <i class="fa-solid fa-stethoscope text-emerald-600 mr-2"></i> 門診看診摘要 (給醫師看)
                </h2>
                <p class="text-sm text-slate-600 mb-4 font-bold">
                    包含早/晚平均值及血壓數據，看診時出示手機畫面即可！
                </p>

                <!-- Time Range Buttons -->
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button onclick="setReportRange(7)" id="range-7" class="py-2 px-2 rounded-xl font-black text-sm bg-emerald-700 text-white shadow">最近 7 天</button>
                    <button onclick="setReportRange(14)" id="range-14" class="py-2 px-2 rounded-xl font-black text-sm bg-slate-100 text-slate-700">最近 14 天</button>
                    <button onclick="setReportRange(30)" id="range-30" class="py-2 px-2 rounded-xl font-black text-sm bg-slate-100 text-slate-700">最近 30 天</button>
                </div>

                <!-- Report Summary Box -->
                <div id="doctor-report-summary" class="bg-emerald-50 rounded-2xl p-4 border-2 border-emerald-200 mb-4 space-y-3">
                    <!-- Dynamic Summary -->
                </div>

                <!-- Action Copy & Print -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="copyDoctorReport()" class="bg-blue-600 active:bg-blue-700 text-white font-black text-base py-3 px-3 rounded-xl shadow flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-copy"></i>
                        <span>複製文字給醫師</span>
                    </button>
                    <button onclick="window.print()" class="bg-slate-700 active:bg-slate-800 text-white font-black text-base py-3 px-3 rounded-xl shadow flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-print"></i>
                        <span>列印看診單</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- TAB 4: 家人遠端查看說明 (Family Sync Info) -->
        <section id="tab-family" class="space-y-4 hidden">
            <div class="bg-white rounded-3xl shadow-md p-5 border-2 border-emerald-100 space-y-4">
                <h2 class="text-xl font-black text-emerald-900 flex items-center">
                    <i class="fa-solid fa-share-nodes text-emerald-600 mr-2"></i> 家人遠端同步說明
                </h2>
                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 space-y-2">
                    <h3 class="font-black text-lg text-emerald-900 flex items-center">
                        <i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i> 無需匯出檔案！即時線上查看
                    </h3>
                    <p class="text-sm text-slate-700 font-bold leading-relaxed">
                        只要把本網頁傳送至家人 LINE 群組，其他家人在手機點開網址，即可隨時遠端同步看到最新的血壓紀錄與長輩歷史資料。
                    </p>
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <label class="block text-sm font-black text-slate-700 mb-2">複製本網頁連結傳至 LINE：</label>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="share-url-input" readonly
                            class="w-full text-xs p-3 bg-white border border-slate-300 rounded-xl text-slate-600 font-mono select-all">
                        <button onclick="copyShareLink()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-black px-4 py-3 rounded-xl whitespace-nowrap shadow">
                            <i class="fa-solid fa-link mr-1"></i> 複製網址
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar (Large Touch Targets) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-slate-200 shadow-2xl z-40">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1 px-2 py-1">
            <button onclick="switchTab('record')" id="nav-record" class="flex flex-col items-center justify-center py-2 text-emerald-700 font-black scale-105">
                <i class="fa-solid fa-pen-to-square text-2xl"></i>
                <span class="text-xs mt-1">輸入紀錄</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center py-2 text-slate-400 font-black">
                <i class="fa-solid fa-chart-line text-2xl"></i>
                <span class="text-xs mt-1">趨勢紀錄</span>
            </button>
            <button onclick="switchTab('doctor')" id="nav-doctor" class="flex flex-col items-center justify-center py-2 text-slate-400 font-black">
                <i class="fa-solid fa-stethoscope text-2xl"></i>
                <span class="text-xs mt-1">醫師看診</span>
            </button>
            <button onclick="switchTab('family')" id="nav-family" class="flex flex-col items-center justify-center py-2 text-slate-400 font-black">
                <i class="fa-solid fa-users text-2xl"></i>
                <span class="text-xs mt-1">家人關心</span>
            </button>
        </div>
    </nav>

    <!-- SENIOR OVERSIZED 9-KEY NUMERIC PAD MODAL -->
    <div id="keypad-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end transition-opacity duration-200">
        <div class="bg-white rounded-t-3xl p-5 max-w-md w-full mx-auto shadow-2xl border-t-4 border-emerald-500">
            <!-- Modal Header -->
            <div class="flex justify-between items-center mb-2">
                <span id="keypad-title" class="text-lg font-black text-slate-800">輸入數值</span>
                <button type="button" onclick="closeKeypad()" class="text-slate-500 text-xl font-black bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Typed Number Display -->
            <div class="bg-slate-900 text-emerald-400 font-black text-5xl p-3.5 rounded-2xl text-right mb-3 shadow-inner tracking-widest min-h-[70px] flex items-center justify-end border-2 border-slate-700">
                <span id="keypad-display">0</span>
            </div>

            <!-- Quick Adjust Stepper Buttons (+5, +1, -1, -5) -->
            <div class="grid grid-cols-4 gap-2 mb-3">
                <button type="button" onclick="keypadAdjust(-5)" class="bg-slate-200 active:bg-slate-300 text-slate-800 font-black text-xl py-2 rounded-xl border border-slate-300 shadow">-5</button>
                <button type="button" onclick="keypadAdjust(-1)" class="bg-slate-200 active:bg-slate-300 text-slate-800 font-black text-xl py-2 rounded-xl border border-slate-300 shadow">-1</button>
                <button type="button" onclick="keypadAdjust(1)" class="bg-slate-200 active:bg-slate-300 text-slate-800 font-black text-xl py-2 rounded-xl border border-slate-300 shadow">+1</button>
                <button type="button" onclick="keypadAdjust(5)" class="bg-slate-200 active:bg-slate-300 text-slate-800 font-black text-xl py-2 rounded-xl border border-slate-300 shadow">+5</button>
            </div>

            <!-- 9-Key Grid Layout -->
            <div class="grid grid-cols-3 gap-2.5 mb-3">
                <button type="button" onclick="keypadPress('7')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">7</button>
                <button type="button" onclick="keypadPress('8')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">8</button>
                <button type="button" onclick="keypadPress('9')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">9</button>

                <button type="button" onclick="keypadPress('4')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">4</button>
                <button type="button" onclick="keypadPress('5')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">5</button>
                <button type="button" onclick="keypadPress('6')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">6</button>

                <button type="button" onclick="keypadPress('1')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">1</button>
                <button type="button" onclick="keypadPress('2')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">2</button>
                <button type="button" onclick="keypadPress('3')" class="bg-slate-100 active:bg-emerald-200 active:text-emerald-900 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">3</button>

                <button type="button" onclick="keypadClear()" class="bg-amber-100 text-amber-900 active:bg-amber-200 font-black text-xl py-3.5 rounded-2xl shadow">重歸零</button>
                <button type="button" onclick="keypadPress('0')" class="bg-slate-100 active:bg-emerald-200 text-slate-900 font-black text-3xl py-3.5 rounded-2xl shadow">0</button>
                <button type="button" onclick="keypadBackspace()" class="bg-red-100 text-red-800 active:bg-red-200 font-black text-xl py-3.5 rounded-2xl shadow flex items-center justify-center">
                    <i class="fa-solid fa-delete-left text-2xl"></i>
                </button>
            </div>

            <!-- Confirm Button -->
            <button type="button" onclick="confirmKeypad()" class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-black text-2xl py-3.5 rounded-2xl shadow-xl flex items-center justify-center space-x-2">
                <i class="fa-solid fa-check"></i>
                <span>確定完成輸入</span>
            </button>
        </div>
    </div>

    <!-- MANAGE ELDERLY USERS MODAL -->
    <div id="user-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-5 max-w-md w-full shadow-2xl border-4 border-emerald-500">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-xl font-black text-emerald-900">管理長輩名單</h3>
                <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- List of existing users -->
            <div id="user-list-container" class="space-y-2 mb-4 max-h-56 overflow-y-auto">
                <!-- Dynamic user items -->
            </div>

            <!-- Add new user form -->
            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <label class="block text-sm font-bold text-slate-700 mb-1">新增長輩姓名 (例如：李奶奶)</label>
                <div class="flex space-x-2">
                    <input type="text" id="new-user-name-input" placeholder="請輸入姓名..."
                        class="w-full p-2.5 bg-white border border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:border-emerald-600">
                    <button onclick="addNewUser()" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl whitespace-nowrap active:scale-95 shadow">
                        新增
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PHOTO ZOOM MODAL -->
    <div id="photo-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4" onclick="closePhotoModal()">
        <img id="modal-img" src="" class="max-w-full max-h-[85vh] rounded-2xl object-contain border-2 border-white shadow-2xl">
    </div>

    <!-- TOAST ALERT NOTIFICATION -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white font-black text-lg py-3 px-6 rounded-2xl shadow-2xl z-50 hidden border-2 border-emerald-400">
        <!-- Toast message inserted here -->
    </div>

    <!-- Main Logic Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        let db = null;
        let auth = null;
        let records = [];
        let users = [
            { id: 'user_default', name: '王爺爺' }
        ];
        let currentUserId = 'user_default';
        let currentTimeSlot = '早晨 Morning';
        let currentPhotoBase64 = '';
        let reportDays = 7;
        let bpChartInstance = null;
        let activeKeypadField = null;
        let keypadBuffer = '120';
        let isCloudMode = false;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'elder-bp-sync-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        // User profile initializers
        function initUsers() {
            const savedUsers = localStorage.getItem('elder_bp_users');
            if (savedUsers) {
                try {
                    users = JSON.parse(savedUsers);
                } catch (e) {
                    users = [{ id: 'user_default', name: '王爺爺' }];
                }
            }
            const savedActiveUser = localStorage.getItem('elder_bp_active_user');
            if (savedActiveUser && users.some(u => u.id === savedActiveUser)) {
                currentUserId = savedActiveUser;
            } else {
                currentUserId = users[0].id;
            }
            renderUserSelectBar();
        }

        function saveUsersToStorage() {
            localStorage.setItem('elder_bp_users', JSON.stringify(users));
            localStorage.setItem('elder_bp_active_user', currentUserId);
            renderUserSelectBar();
        }

        function renderUserSelectBar() {
            const selectEl = document.getElementById('user-select-bar');
            selectEl.innerHTML = users.map(u => `<option value="${u.id}" ${u.id === currentUserId ? 'selected' : ''}>${u.name}</option>`).join('');
            
            const activeUserObj = users.find(u => u.id === currentUserId) || users[0];
            document.getElementById('active-user-name').innerText = activeUserObj.name;
        }

        window.switchActiveUser = function(userId) {
            currentUserId = userId;
            localStorage.setItem('elder_bp_active_user', currentUserId);
            renderUserSelectBar();
            updateUI();
            showToast(`已切換記錄成員：${(users.find(u => u.id === userId) || {}).name}`);
        };

        // User Management Modal Actions
        window.openUserModal = function() {
            renderUserListModal();
            document.getElementById('user-modal').classList.remove('hidden');
        };

        window.closeUserModal = function() {
            document.getElementById('user-modal').classList.add('hidden');
        };

        function renderUserListModal() {
            const container = document.getElementById('user-list-container');
            container.innerHTML = users.map(u => `
                <div class="flex items-center justify-between bg-slate-100 p-3 rounded-xl border border-slate-200">
                    <span class="font-black text-lg text-slate-800">${u.name} ${u.id === currentUserId ? '<span class="text-xs bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded-full ml-2">使用中</span>' : ''}</span>
                    <div class="flex space-x-2">
                        <button onclick="editUserName('${u.id}')" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">改名</button>
                        ${users.length > 1 ? `<button onclick="deleteUser('${u.id}')" class="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">刪除</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.addNewUser = function() {
            const input = document.getElementById('new-user-name-input');
            const name = input.value.trim();
            if (!name) {
                showToast('❌ 請輸入姓名');
                return;
            }
            const newUser = { id: 'user_' + Date.now(), name: name };
            users.push(newUser);
            currentUserId = newUser.id;
            saveUsersToStorage();
            input.value = '';
            renderUserListModal();
            showToast(`✅ 已新增長輩：${name}`);
            updateUI();
        };

        window.editUserName = function(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            const newName = prompt('請輸入新的姓名：', user.name);
            if (newName && newName.trim()) {
                user.name = newName.trim();
                saveUsersToStorage();
                renderUserListModal();
                showToast('✅ 姓名已更新');
                updateUI();
            }
        };

        window.deleteUser = function(userId) {
            if (users.length <= 1) {
                showToast('❌ 至少需保留一位成員');
                return;
            }
            if (!confirm('確定要刪除此長輩名稱嗎？')) return;
            users = users.filter(u => u.id !== userId);
            if (currentUserId === userId) {
                currentUserId = users[0].id;
            }
            saveUsersToStorage();
            renderUserListModal();
            showToast('🗑️ 已刪除成員');
            updateUI();
        };

        // Firebase Sync Initialization
        async function initFirebase() {
            initUsers();

            if (firebaseConfig) {
                try {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    isCloudMode = true;
                    document.getElementById('sync-text').innerText = '雲端即時同步';
                    document.getElementById('sync-badge').className = 'bg-emerald-900 border border-emerald-500 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-bold flex items-center space-x-1';

                    // Realtime sync from Firestore
                    const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'bp_records'));
                    onSnapshot(q, (snapshot) => {
                        records = [];
                        snapshot.forEach((docSnap) => {
                            records.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        records.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
                        updateUI();
                    }, (err) => {
                        console.error("Firestore error:", err);
                        initLocalFallback();
                    });
                } catch (e) {
                    console.error("Firebase init failed:", e);
                    initLocalFallback();
                }
            } else {
                initLocalFallback();
            }
        }

        function initLocalFallback() {
            isCloudMode = false;
            document.getElementById('sync-text').innerText = '本機記錄模式';
            document.getElementById('sync-badge').className = 'bg-amber-900 border border-amber-500 text-amber-200 text-xs px-2.5 py-1 rounded-full font-bold flex items-center space-x-1';
            
            const saved = localStorage.getItem('elder_bp_records');
            if (saved) {
                try { records = JSON.parse(saved); } catch (e) { records = []; }
            }
            updateUI();
        }

        window.saveRecordToStorage = async function(newRecord) {
            newRecord.userId = currentUserId;

            if (isCloudMode && db && auth && auth.currentUser) {
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'bp_records'), newRecord);
                    showToast('✅ 已同步儲存至雲端！家人可即時查看');
                    return;
                } catch (e) {
                    console.error("Cloud save failed:", e);
                }
            }
            // Local fallback
            records.unshift({ id: 'local_' + Date.now(), ...newRecord });
            localStorage.setItem('elder_bp_records', JSON.stringify(records));
            showToast('✅ 已儲存至本機');
            updateUI();
        };

        window.deleteRecordFromStorage = async function(id) {
            if (!confirm('確定要刪除此筆記錄嗎？')) return;
            if (isCloudMode && db && !id.startsWith('local_')) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bp_records', id));
                    showToast('🗑️ 紀錄已刪除');
                    return;
                } catch (e) { console.error(e); }
            }
            records = records.filter(r => r.id !== id);
            localStorage.setItem('elder_bp_records', JSON.stringify(records));
            showToast('🗑️ 紀錄已刪除');
            updateUI();
        };

        // Keypad Logic
        window.openKeypad = function(field) {
            activeKeypadField = field;
            const currentVal = document.getElementById(field + '-input').value || (field === 'sys' ? '120' : field === 'dia' ? '80' : '75');
            keypadBuffer = String(currentVal);

            const names = { sys: '收縮壓 (高壓 SYS)', dia: '舒張壓 (低壓 DIA)', pulse: '脈搏 (Pulse)' };
            document.getElementById('keypad-title').innerText = '大鍵盤輸入 - ' + names[field];
            updateKeypadDisplay();
            document.getElementById('keypad-modal').classList.remove('hidden');
        };

        window.closeKeypad = function() {
            document.getElementById('keypad-modal').classList.add('hidden');
            activeKeypadField = null;
        };

        function updateKeypadDisplay() {
            document.getElementById('keypad-display').innerText = keypadBuffer || '0';
        }

        window.keypadPress = function(numStr) {
            if (keypadBuffer === '0') {
                keypadBuffer = numStr;
            } else if (keypadBuffer.length < 3) {
                keypadBuffer += numStr;
            }
            updateKeypadDisplay();
        };

        window.keypadClear = function() {
            keypadBuffer = '0';
            updateKeypadDisplay();
        };

        window.keypadBackspace = function() {
            if (keypadBuffer.length <= 1) {
                keypadBuffer = '0';
            } else {
                keypadBuffer = keypadBuffer.slice(0, -1);
            }
            updateKeypadDisplay();
        };

        window.keypadAdjust = function(amount) {
            let val = parseInt(keypadBuffer) || 0;
            val = Math.max(0, val + amount);
            keypadBuffer = String(val);
            updateKeypadDisplay();
        };

        window.confirmKeypad = function() {
            if (!activeKeypadField) return;
            const num = parseInt(keypadBuffer) || 0;
            document.getElementById(activeKeypadField + '-input').value = num;
            document.getElementById(activeKeypadField + '-display').innerText = num;
            closeKeypad();
        };

        window.stepValue = function(field, amount) {
            const input = document.getElementById(field + '-input');
            let val = parseInt(input.value) || (field === 'sys' ? 120 : 80);
            val = Math.max(0, val + amount);
            input.value = val;
            document.getElementById(field + '-display').innerText = val;
        };

        window.setTimeSlot = function(slot) {
            currentTimeSlot = slot;
            const btnM = document.getElementById('btn-morning');
            const btnE = document.getElementById('btn-evening');
            if (slot.includes('早')) {
                btnM.className = "py-3.5 px-3 rounded-2xl font-black text-xl flex items-center justify-center space-x-2 border-2 transition-all bg-amber-500 text-white border-amber-600 shadow";
                btnE.className = "py-3.5 px-3 rounded-2xl font-black text-xl flex items-center justify-center space-x-2 border-2 transition-all bg-slate-100 text-slate-700 border-slate-300";
            } else {
                btnE.className = "py-3.5 px-3 rounded-2xl font-black text-xl flex items-center justify-center space-x-2 border-2 transition-all bg-indigo-600 text-white border-indigo-700 shadow";
                btnM.className = "py-3.5 px-3 rounded-2xl font-black text-xl flex items-center justify-center space-x-2 border-2 transition-all bg-slate-100 text-slate-700 border-slate-300";
            }
        };

        window.appendTag = function(tag) {
            const memoInput = document.getElementById('memo-input');
            memoInput.value = memoInput.value ? (memoInput.value + ' ' + tag) : tag;
        };

        window.handlePhotoUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentPhotoBase64 = e.target.result;
                document.getElementById('photo-preview').src = currentPhotoBase64;
                document.getElementById('photo-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        };

        window.removePhoto = function() {
            currentPhotoBase64 = '';
            document.getElementById('photo-input').value = '';
            document.getElementById('photo-preview-container').classList.add('hidden');
        };

        // Form Submit
        window.handleFormSubmit = function(event) {
            event.preventDefault();
            const date = document.getElementById('record-date').value;
            const sys = parseInt(document.getElementById('sys-input').value);
            const dia = parseInt(document.getElementById('dia-input').value);
            const pulse = parseInt(document.getElementById('pulse-input').value) || 0;
            const memo = document.getElementById('memo-input').value;

            if (!date || isNaN(sys) || isNaN(dia)) {
                showToast('❌ 請完整填寫測量數值');
                return;
            }

            const evaluation = evaluateBP(sys, dia);

            const newRecord = {
                date,
                timeSlot: currentTimeSlot,
                sys,
                dia,
                pulse,
                memo,
                photoUrl: currentPhotoBase64,
                evaluationLevel: evaluation.level,
                evaluationTitle: evaluation.title,
                createdAt: new Date().toISOString()
            };

            window.saveRecordToStorage(newRecord);

            // Reset memo and photo
            document.getElementById('memo-input').value = '';
            window.removePhoto();
            switchTab('history');
        };

        // Taiwan MOHW Blood Pressure Guidelines Evaluator
        function evaluateBP(sys, dia) {
            if (sys > 180 || dia >= 120) {
                return { level: 'crisis', title: '危急狀況', badge: 'bg-red-600 text-white' };
            }
            if (sys >= 140 || dia >= 90) {
                return { level: 'stage2', title: '第二期高血壓', badge: 'bg-red-100 text-red-800 border-red-300' };
            }
            if ((sys >= 130 && sys <= 139) || (dia >= 80 && dia <= 89)) {
                return { level: 'stage1', title: '第一期高血壓', badge: 'bg-orange-100 text-orange-800 border-orange-300' };
            }
            if ((sys >= 120 && sys <= 129) && dia < 80) {
                return { level: 'elevated', title: '血壓偏高 (正常高值)', badge: 'bg-yellow-100 text-yellow-800 border-yellow-300' };
            }
            if (sys < 90 || dia < 60) {
                return { level: 'low', title: '血壓過低', badge: 'bg-blue-100 text-blue-800 border-blue-300' };
            }
            return { level: 'normal', title: '血壓正常', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300' };
        }

        window.switchTab = function(tabName) {
            const tabs = ['record', 'history', 'doctor', 'family'];
            tabs.forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('nav-' + t).className = "flex flex-col items-center justify-center py-2 text-slate-400 font-black";
            });

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('nav-' + tabName).className = "flex flex-col items-center justify-center py-2 text-emerald-700 font-black scale-105";

            if (tabName === 'history') {
                renderChart();
            }
        };

        function getUserRecords() {
            return records.filter(r => (r.userId || 'user_default') === currentUserId);
        }

        function updateUI() {
            const userRecords = getUserRecords();

            // Crisis banner check
            const crisisBanner = document.getElementById('crisis-banner');
            if (userRecords.length > 0 && (userRecords[0].sys > 180 || userRecords[0].dia >= 120)) {
                crisisBanner.classList.remove('hidden');
                document.getElementById('crisis-msg').innerText = `最新數值 (${userRecords[0].sys}/${userRecords[0].dia} mmHg) 達危急狀況！請聯繫家人或前往就醫。`;
            } else {
                crisisBanner.classList.add('hidden');
            }

            // Records List
            document.getElementById('record-count').innerText = userRecords.length + ' 筆';
            const listEl = document.getElementById('records-list');
            if (userRecords.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold text-lg"><i class="fa-solid fa-folder-open text-4xl block mb-2"></i>尚無此長輩的血壓紀錄</div>`;
            } else {
                listEl.innerHTML = userRecords.map(r => {
                    const evalObj = evaluateBP(r.sys, r.dia);
                    return `
                        <div class="bg-slate-50 rounded-2xl p-3.5 border-2 border-slate-200 space-y-2">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-2">
                                    <span class="bg-emerald-800 text-white font-bold px-2.5 py-0.5 rounded-lg text-sm">${r.date}</span>
                                    <span class="text-slate-700 font-bold text-sm">
                                        <i class="fa-solid ${r.timeSlot.includes('早') ? 'fa-sun text-amber-500' : 'fa-moon text-indigo-500'} mr-1"></i>${r.timeSlot}
                                    </span>
                                </div>
                                <button onclick="deleteRecordFromStorage('${r.id}')" class="text-red-500 text-lg p-1"><i class="fa-solid fa-trash-can"></i></button>
                            </div>

                            <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-slate-200">
                                <div>
                                    <span class="text-2xl font-black text-slate-900">${r.sys} / ${r.dia}</span>
                                    <span class="text-xs text-slate-500 font-bold">mmHg</span>
                                    ${r.pulse ? `<span class="ml-2 text-sm font-bold text-purple-700"><i class="fa-solid fa-heart-pulse mr-0.5"></i>${r.pulse}次</span>` : ''}
                                </div>
                                <span class="px-2.5 py-1 rounded-lg text-xs font-black border ${evalObj.badge}">${evalObj.title}</span>
                            </div>

                            ${r.memo ? `<p class="text-xs text-slate-700 bg-amber-50 p-2 rounded-lg font-bold"><i class="fa-solid fa-note-sticky text-amber-600 mr-1"></i>${r.memo}</p>` : ''}
                            ${r.photoUrl ? `<img src="${r.photoUrl}" onclick="openPhotoModal('${r.photoUrl}')" class="w-14 h-14 object-cover rounded-xl border border-emerald-400 cursor-pointer">` : ''}
                        </div>
                    `;
                }).join('');
            }
            renderDoctorReport();
        }

        function renderChart() {
            const userRecords = getUserRecords();
            const ctx = document.getElementById('bpChart').getContext('2d');
            const recent14 = [...userRecords].reverse().slice(-14);

            const labels = recent14.map(r => `${r.date.slice(5)} (${r.timeSlot.slice(0,1)})`);
            const sysData = recent14.map(r => r.sys);
            const diaData = recent14.map(r => r.dia);

            if (bpChartInstance) { bpChartInstance.destroy(); }

            bpChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '收縮壓 SYS', data: sysData, borderColor: '#ef4444', backgroundColor: '#ef4444', borderWidth: 3 },
                        { label: '舒張壓 DIA', data: diaData, borderColor: '#3b82f6', backgroundColor: '#3b82f6', borderWidth: 3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { min: 50, max: 200 } }
                }
            });
        }

        window.setReportRange = function(days) {
            reportDays = days;
            ['7', '14', '30'].forEach(d => {
                document.getElementById('range-' + d).className = (parseInt(d) === days) ?
                    "py-2 px-2 rounded-xl font-black text-sm bg-emerald-700 text-white shadow" :
                    "py-2 px-2 rounded-xl font-black text-sm bg-slate-100 text-slate-700";
            });
            renderDoctorReport();
        };

        function renderDoctorReport() {
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - reportDays);
            const userRecords = getUserRecords();
            const filtered = userRecords.filter(r => new Date(r.date) >= cutoffDate);
            const summaryEl = document.getElementById('doctor-report-summary');
            const currentUser = users.find(u => u.id === currentUserId) || { name: '長輩' };

            if (filtered.length === 0) {
                summaryEl.innerHTML = `<p class="text-center text-slate-500 py-3 font-bold text-sm">${currentUser.name} 最近 ${reportDays} 天內尚無紀錄。</p>`;
                return;
            }

            const avgSys = Math.round(filtered.reduce((acc, r) => acc + r.sys, 0) / filtered.length);
            const avgDia = Math.round(filtered.reduce((acc, r) => acc + r.dia, 0) / filtered.length);

            summaryEl.innerHTML = `
                <div class="flex justify-between items-center border-b border-emerald-200 pb-2">
                    <span class="text-sm font-bold text-emerald-900">姓名</span>
                    <span class="text-xl font-black text-emerald-900">${currentUser.name}</span>
                </div>
                <div class="flex justify-between items-center border-b border-emerald-200 pb-2">
                    <span class="text-sm font-bold text-emerald-900">統計區間</span>
                    <span class="text-base font-black text-emerald-900">最近 ${reportDays} 天 (${filtered.length} 筆)</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-emerald-900">平均血壓</span>
                    <span class="text-2xl font-black text-red-600">${avgSys} / ${avgDia} <span class="text-xs text-slate-600 font-normal">mmHg</span></span>
                </div>
            `;
        }

        window.copyDoctorReport = function() {
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - reportDays);
            const userRecords = getUserRecords();
            const filtered = userRecords.filter(r => new Date(r.date) >= cutoffDate);
            const currentUser = users.find(u => u.id === currentUserId) || { name: '長輩' };

            if (filtered.length === 0) {
                showToast('❌ 無資料可複製');
                return;
            }

            const avgSys = Math.round(filtered.reduce((acc, r) => acc + r.sys, 0) / filtered.length);
            const avgDia = Math.round(filtered.reduce((acc, r) => acc + r.dia, 0) / filtered.length);

            let text = `【血壓量測看診摘要】\n姓名：${currentUser.name}\n區間：最近 ${reportDays} 天 (${filtered.length}筆)\n平均血壓：${avgSys} / ${avgDia} mmHg\n\n明細：\n`;
            filtered.forEach(r => { text += `- ${r.date} (${r.timeSlot}): ${r.sys}/${r.dia} mmHg${r.memo ? ' ['+r.memo+']' : ''}\n`; });

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('📋 已成功複製看診摘要！');
        };

        window.openPhotoModal = function(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('photo-modal').classList.remove('hidden');
        };

        window.closePhotoModal = function() {
            document.getElementById('photo-modal').classList.add('hidden');
        };

        window.copyShareLink = function() {
            const linkInput = document.getElementById('share-url-input');
            linkInput.value = window.location.href;
            linkInput.select();
            document.execCommand('copy');
            showToast('🔗 網址已複製！可傳給家人');
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('record-date').value = today;
            document.getElementById('share-url-input').value = window.location.href;

            initFirebase();
        };
    </script>
</body>
</html>
