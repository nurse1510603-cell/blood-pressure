<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長輩健康守護與行事曆 - Firebase 雲端同步版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (Compat 輕量版) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    html { touch-action: manipulation; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #e6f0eb;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-keypad { box-shadow: 0 4px 0 #94a3b8; transition: all 0.1s ease; }
    .btn-keypad:active { transform: translateY(4px); box-shadow: 0 0 0 #94a3b8; }
    /* 高飽和度分頁與按鈕樣式 */
    .tab-btn { background-color: #cbd5e1; color: #334155; font-weight: 900; }
    .tab-btn.active { background-color: #1b4d3e !important; color: #ffffff !important; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
  </style>
</head>
<body class="pb-28">

  <!-- 頂部標題列 -->
  <header class="bg-[#1b4d3e] text-white p-4 sticky top-0 z-50 shadow-lg border-b-4 border-[#12352b]">
    <div class="max-w-md mx-auto flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-heart-pulse text-2xl text-rose-400"></i>
          <h1 class="text-xl font-black tracking-wide">長輩健康守護</h1>
        </div>
        <div id="sync-status-badge" class="bg-[#12352b] text-emerald-200 text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 font-black border border-emerald-400/60 shadow-inner">
          <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Firebase 連線中</span>
        </div>
      </div>

      <div class="flex items-center gap-2 bg-[#12352b] p-2.5 rounded-xl mt-1 border border-emerald-700">
        <i class="fa-solid fa-user-gear text-emerald-300 ml-1 text-lg"></i>
        <span class="text-sm font-black whitespace-nowrap text-emerald-100">目前長輩：</span>
        <select id="user-select" onchange="switchUser(this.value)" class="bg-white text-slate-900 font-black text-lg rounded-lg px-3 py-1 flex-1 focus:outline-none shadow">
        </select>
        <button type="button" onclick="promptAddUser()" class="bg-[#2d7a5f] hover:bg-[#358f6e] active:bg-[#1b4d3e] text-white px-3.5 py-1.5 text-sm font-black rounded-lg shadow border border-emerald-400 cursor-pointer">
          <i class="fa-solid fa-user-plus mr-1"></i>新增
        </button>
      </div>
    </div>
  </header>

  <!-- 主導覽頁籤 -->
  <main class="max-w-md mx-auto p-4 flex flex-col gap-6">
    <div class="grid grid-cols-4 gap-2 bg-[#b8d0c7] p-2 rounded-2xl text-center shadow-md border-2 border-[#9bb8ad]">
      <button id="tab-bp-btn" onclick="switchTab('bp')" class="tab-btn active py-2.5 text-sm rounded-xl transition-all"><i class="fa-solid fa-stethoscope block text-base mb-0.5"></i>血壓</button>
      <button id="tab-pain-btn" onclick="switchTab('pain')" class="tab-btn py-2.5 text-sm rounded-xl transition-all"><i class="fa-solid fa-child block text-base mb-0.5"></i>疼痛</button>
      <button id="tab-med-btn" onclick="switchTab('med')" class="tab-btn py-2.5 text-sm rounded-xl transition-all"><i class="fa-solid fa-pills block text-base mb-0.5"></i>用藥</button>
      <button id="tab-cal-btn" onclick="switchTab('cal')" class="tab-btn py-2.5 text-sm rounded-xl transition-all"><i class="fa-solid fa-calendar-days block text-base mb-0.5"></i>行事曆</button>
    </div>

    <!-- 1. 血壓頁籤 -->
    <section id="tab-bp" class="tab-content flex flex-col gap-6">
      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <h2 class="text-xl font-black text-[#1b4d3e] border-b-2 border-slate-200 pb-2 mb-4 flex items-center justify-between">
          <span><i class="fa-solid fa-pen-to-square text-[#2d7a5f] mr-2"></i>輸入血壓數值</span>
        </h2>
        <div class="bg-[#f0fdf4] p-3 rounded-2xl border-2 border-[#b8d0c7] mb-4">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-xs font-black text-slate-700 mb-0.5">日期：</label><input type="date" id="bp-date-input" class="w-full bg-white border-2 border-slate-300 rounded-xl p-2 font-black text-sm text-slate-900"></div>
            <div><label class="block text-xs font-black text-slate-700 mb-0.5">時間：</label><input type="time" id="bp-time-input" class="w-full bg-white border-2 border-slate-300 rounded-xl p-2 font-black text-sm text-slate-900"></div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <button id="time-morning" onclick="setTimeSlot('morning')" class="py-3 rounded-2xl font-black text-base border-2 border-amber-500 bg-amber-100 text-amber-900 shadow"><i class="fa-solid fa-sun text-amber-600 mr-1"></i> 早上</button>
          <button id="time-evening" onclick="setTimeSlot('evening')" class="py-3 rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-100 text-slate-600"><i class="fa-solid fa-moon text-indigo-600 mr-1"></i> 晚上</button>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-3">
          <div id="box-sys" onclick="setActiveInput('sys')" class="p-3 bg-rose-50 border-4 border-rose-600 rounded-2xl text-center cursor-pointer shadow-md">
            <span class="text-xs font-black text-rose-800 block">收縮壓 (高壓)</span>
            <span id="val-sys" class="text-4xl font-black text-rose-900 my-1 block">120</span>
          </div>
          <div id="box-dia" onclick="setActiveInput('dia')" class="p-3 bg-sky-50 border-2 border-sky-300 rounded-2xl text-center cursor-pointer opacity-80">
            <span class="text-xs font-black text-sky-800 block">舒張壓 (低壓)</span>
            <span id="val-dia" class="text-4xl font-black text-sky-900 my-1 block">80</span>
          </div>
        </div>
        <div id="box-pulse" onclick="setActiveInput('pulse')" class="p-3 bg-amber-50 border-2 border-amber-300 rounded-2xl text-center cursor-pointer opacity-80 mb-4">
          <span class="text-xs font-black text-amber-900 block">脈搏 (心跳/分)</span>
          <span id="val-pulse" class="text-3xl font-black text-amber-950 my-1 block">72</span>
        </div>
        <div class="bg-slate-200 p-3 rounded-2xl mb-4 border border-slate-300">
          <div class="grid grid-cols-3 gap-2">
            <button onclick="pressKey(1)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">1</button>
            <button onclick="pressKey(2)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">2</button>
            <button onclick="pressKey(3)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">3</button>
            <button onclick="pressKey(4)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">4</button>
            <button onclick="pressKey(5)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">5</button>
            <button onclick="pressKey(6)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">6</button>
            <button onclick="pressKey(7)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">7</button>
            <button onclick="pressKey(8)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">8</button>
            <button onclick="pressKey(9)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">9</button>
            <button onclick="pressKey('clear')" class="btn-keypad bg-amber-200 text-amber-950 text-lg font-black py-3 rounded-xl">清除</button>
            <button onclick="pressKey(0)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-900">0</button>
            <button onclick="pressKey('back')" class="btn-keypad bg-slate-300 text-slate-800 text-xl font-black py-3 rounded-xl"><i class="fa-solid fa-backspace"></i></button>
          </div>
        </div>
        <button onclick="saveBPRecord()" class="w-full bg-[#1b4d3e] hover:bg-[#12352b] active:bg-[#0a1f18] text-white font-black text-xl py-4 rounded-2xl shadow-xl border-2 border-emerald-600">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存並同步至 Firebase
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xl font-black text-[#1b4d3e]"><i class="fa-solid fa-chart-line text-[#2d7a5f] mr-2"></i>血壓趨勢與歷史</h2>
          <button onclick="loadUserData()" class="bg-[#b8d0c7] hover:bg-[#a3c4b7] text-[#1b4d3e] text-xs font-black px-3.5 py-2 rounded-xl shadow"><i class="fa-solid fa-rotate mr-1"></i>重新整理</button>
        </div>
        <div class="h-56 mb-4"><canvas id="bpChart"></canvas></div>
        <div id="bp-history-list" class="flex flex-col gap-2 max-h-72 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 2. 疼痛頁籤 -->
    <section id="tab-pain" class="tab-content hidden flex-col gap-6">
      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <h2 class="text-xl font-black text-[#1b4d3e] border-b-2 border-slate-200 pb-2 mb-4">
          <i class="fa-solid fa-child text-[#2d7a5f] mr-2"></i>記錄疼痛狀況
        </h2>
        <div class="mb-4">
          <label class="block text-sm font-black text-slate-700 mb-1">疼痛部位：</label>
          <input type="text" id="pain-part" placeholder="例如：右膝蓋、腰部" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-slate-900">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-black text-slate-700 mb-1">疼痛程度 (1-10分)：</label>
          <input type="number" id="pain-level" min="1" max="10" value="3" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-slate-900">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-black text-slate-700 mb-1">備註說明：</label>
          <textarea id="pain-note" placeholder="記錄疼痛性質..." class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-slate-900 h-20"></textarea>
        </div>
        <button onclick="savePainRecord()" class="w-full bg-[#1b4d3e] hover:bg-[#12352b] text-white font-black text-xl py-4 rounded-2xl shadow-xl border-2 border-emerald-600">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存疼痛紀錄
        </button>
      </div>
      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <h2 class="text-xl font-black text-[#1b4d3e] mb-3">疼痛歷史紀錄</h2>
        <div id="pain-history-list" class="flex flex-col gap-2 max-h-72 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 3. 用藥頁籤 -->
    <section id="tab-med" class="tab-content hidden flex-col gap-6">
      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <h2 class="text-xl font-black text-[#1b4d3e] border-b-2 border-slate-200 pb-2 mb-4">
          <i class="fa-solid fa-pills text-[#2d7a5f] mr-2"></i>記錄用藥狀況
        </h2>
        <div class="mb-4">
          <label class="block text-sm font-black text-slate-700 mb-1">藥品名稱與劑量：</label>
          <input type="text" id="med-name" placeholder="例如：降血壓藥 1顆" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-slate-900">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-black text-slate-700 mb-1">服用時段：</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="flex items-center justify-center p-3 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-slate-800 cursor-pointer"><input type="checkbox" name="med-time" value="早餐後" class="mr-2 w-4 h-4">早餐後</label>
            <label class="flex items-center justify-center p-3 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-slate-800 cursor-pointer"><input type="checkbox" name="med-time" value="午餐後" class="mr-2 w-4 h-4">午餐後</label>
            <label class="flex items-center justify-center p-3 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-slate-800 cursor-pointer"><input type="checkbox" name="med-time" value="晚餐後" class="mr-2 w-4 h-4">晚餐後</label>
          </div>
        </div>
        <button onclick="saveMedRecord()" class="w-full bg-[#1b4d3e] hover:bg-[#12352b] text-white font-black text-xl py-4 rounded-2xl shadow-xl border-2 border-emerald-600">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存用藥紀錄
        </button>
      </div>
      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <h2 class="text-xl font-black text-[#1b4d3e] mb-3">用藥歷史紀錄</h2>
        <div id="med-history-list" class="flex flex-col gap-2 max-h-72 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 4. 行事曆頁籤 -->
    <section id="tab-cal" class="tab-content hidden flex-col gap-6">
      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <h2 class="text-xl font-black text-[#1b4d3e] border-b-2 border-slate-200 pb-2 mb-4">
          <i class="fa-solid fa-calendar-days text-[#2d7a5f] mr-2"></i>新增預約或回診
        </h2>
        <div class="mb-4">
          <label class="block text-sm font-black text-slate-700 mb-1">事件標題：</label>
          <input type="text" id="cal-title" placeholder="例如：心臟科回診" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-slate-900">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-black text-slate-700 mb-1">預約日期：</label>
          <input type="date" id="cal-date" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-slate-900">
        </div>
        <button onclick="saveCalRecord()" class="w-full bg-[#1b4d3e] hover:bg-[#12352b] text-white font-black text-xl py-4 rounded-2xl shadow-xl border-2 border-emerald-600">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存行事曆事件
        </button>
      </div>
      <div class="bg-white rounded-3xl p-5 shadow-xl border-2 border-[#b8d0c7]">
        <h2 class="text-xl font-black text-[#1b4d3e] mb-3">行事曆清單</h2>
        <div id="cal-history-list" class="flex flex-col gap-2 max-h-72 overflow-y-auto"></div>
      </div>
    </section>
  </main>

  <script>
    // 💡 請將您的 Firebase 專屬設定貼在下方大括號內：
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DEFAULT_USERS = ['王爺爺', '李奶奶', '媽咪'];
    let currentActiveUser = '王爺爺';
    let currentInputMode = 'sys';
    let currentSlot = 'morning';

    window.onload = function() {
      initDefaultDateTime();
      initUserSelect();
      initChart();
      loadUserData();
    };

    function initDefaultDateTime() {
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = now.toTimeString().slice(0, 5);
      document.getElementById('bp-date-input').value = dateStr;
      document.getElementById('bp-time-input').value = timeStr;
      document.getElementById('cal-date').value = dateStr;
    }

    function initUserSelect() {
      let users = JSON.parse(localStorage.getItem('bp_user_list')) || [...DEFAULT_USERS];
      const select = document.getElementById('user-select');
      select.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
      if (!users.includes(currentActiveUser)) currentActiveUser = users[0];
      select.value = currentActiveUser;
    }

    function switchUser(userName) {
      currentActiveUser = userName;
      loadUserData();
    }

    function promptAddUser() {
      const name = prompt("請輸入新長輩姓名:");
      if (name && name.trim() !== "") {
        let users = JSON.parse(localStorage.getItem('bp_user_list')) || [...DEFAULT_USERS];
        if (!users.includes(name.trim())) {
          users.push(name.trim());
          localStorage.setItem('bp_user_list', JSON.stringify(users));
        }
        currentActiveUser = name.trim();
        initUserSelect();
        loadUserData();
      }
    }

    // 分頁切換邏輯
    function switchTab(tab) {
      ['bp', 'pain', 'med', 'cal'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('flex');
        document.getElementById(`tab-${t}-btn`).classList.remove('active');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('flex');
      document.getElementById(`tab-${tab}-btn`).classList.add('active');
    }

    function setTimeSlot(slot) {
      currentSlot = slot;
      document.getElementById('time-morning').className = slot === 'morning' ? "py-3 rounded-2xl font-black text-base border-2 border-amber-500 bg-amber-100 text-amber-900 shadow" : "py-3 rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-100 text-slate-600";
      document.getElementById('time-evening').className = slot === 'evening' ? "py-3 rounded-2xl font-black text-base border-2 border-indigo-500 bg-indigo-100 text-indigo-900 shadow" : "py-3 rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-100 text-slate-600";
    }

    function setActiveInput(mode) {
      currentInputMode = mode;
      document.getElementById('box-sys').className = mode === 'sys' ? "p-3 bg-rose-50 border-4 border-rose-600 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-rose-50 border-2 border-rose-300 rounded-2xl text-center cursor-pointer opacity-80";
      document.getElementById('box-dia').className = mode === 'dia' ? "p-3 bg-sky-50 border-4 border-sky-600 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-sky-50 border-2 border-sky-300 rounded-2xl text-center cursor-pointer opacity-80";
      document.getElementById('box-pulse').className = mode === 'pulse' ? "p-3 bg-amber-50 border-4 border-amber-600 rounded-2xl text-center cursor-pointer shadow-md mb-4" : "p-3 bg-amber-50 border-2 border-amber-300 rounded-2xl text-center cursor-pointer opacity-80 mb-4";
    }

    function pressKey(key) {
      const el = document.getElementById(`val-${currentInputMode}`);
      let cur = el.innerText;
      if (key === 'clear') el.innerText = '0';
      else if (key === 'back') el.innerText = cur.length > 1 ? cur.slice(0, -1) : '0';
      else el.innerText = cur === '0' ? String(key) : cur + key;
    }

    // 🚀 儲存血壓
    async function saveBPRecord() {
      const record = {
        time: `${document.getElementById('bp-date-input').value} ${document.getElementById('bp-time-input').value}`,
        user: currentActiveUser,
        sys: parseInt(document.getElementById('val-sys').innerText),
        dia: parseInt(document.getElementById('val-dia').innerText),
        pulse: parseInt(document.getElementById('val-pulse').innerText),
        slot: currentSlot === 'morning' ? '早上' : '晚上',
        type: 'bp',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      try {
        await db.collection("health_records").add(record);
        alert(`已成功儲存並同步 ${currentActiveUser} 的血壓紀錄！`);
        loadUserData();
      } catch (e) {
        alert("儲存失敗，請檢查網路連線。");
      }
    }

    // 🚀 儲存疼痛
    async function savePainRecord() {
      const record = {
        user: currentActiveUser,
        part: document.getElementById('pain-part').value,
        level: document.getElementById('pain-level').value,
        note: document.getElementById('pain-note').value,
        type: 'pain',
        time: new Date().toLocaleString(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      try {
        await db.collection("health_records").add(record);
        alert("疼痛紀錄已同步！");
        loadUserData();
      } catch (e) { alert("儲存失敗"); }
    }

    // 🚀 儲存用藥
    async function saveMedRecord() {
      const times = Array.from(document.querySelectorAll('input[name="med-time"]:checked')).map(el => el.value);
      const record = {
        user: currentActiveUser,
        name: document.getElementById('med-name').value,
        medTimes: times,
        type: 'med',
        time: new Date().toLocaleString(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      try {
        await db.collection("health_records").add(record);
        alert("用藥紀錄已同步！");
        loadUserData();
      } catch (e) { alert("儲存失敗"); }
    }

    // 🚀 儲存行事曆
    async function saveCalRecord() {
      const record = {
        user: currentActiveUser,
        title: document.getElementById('cal-title').value,
        date: document.getElementById('cal-date').value,
        type: 'cal',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      try {
        await db.collection("health_records").add(record);
        alert("行事曆事件已同步！");
        loadUserData();
      } catch (e) { alert("儲存失敗"); }
    }

    // 🚀 讀取資料
    async function loadUserData() {
      const badge = document.getElementById('sync-status-badge');
      if (badge) badge.innerHTML = `<span class="w-3 h-3 rounded-full bg-amber-400 animate-ping"></span><span>同步中...</span>`;

      try {
        const snapshot = await db.collection("health_records")
          .where("user", "==", currentActiveUser)
          .orderBy("createdAt", "desc")
          .get();

        const bpRecords = [];
        const painRecords = [];
        const medRecords = [];
        const calRecords = [];

        snapshot.forEach(doc => {
          const d = doc.data();
          d.id = doc.id;
          if (d.type === 'bp' || d.sys) bpRecords.push(d);
          else if (d.type === 'pain') painRecords.push(d);
          else if (d.type === 'med') medRecords.push(d);
          else if (d.type === 'cal') calRecords.push(d);
        });

        renderBPUI(bpRecords);
        renderPainUI(painRecords);
        renderMedUI(medRecords);
        renderCalUI(calRecords);

        if (badge) badge.innerHTML = `<span class="w-3 h-3 rounded-full bg-emerald-400"></span><span>Firebase 已同步</span>`;
      } catch (e) {
        if (badge) badge.innerHTML = `<span class="w-3 h-3 rounded-full bg-amber-500"></span><span>離線模式</span>`;
      }
    }

    function renderBPUI(records) {
      const list = document.getElementById('bp-history-list');
      list.innerHTML = records.length === 0 ? '<div class="text-slate-500 font-bold text-center py-3">尚無血壓紀錄</div>' : records.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-100 rounded-xl border border-slate-300 shadow-sm">
          <div>
            <span class="text-xs font-black text-[#1b4d3e]">${r.time || ''} (${r.slot || ''})</span>
            <div class="text-xl font-black text-slate-900">${r.sys} / ${r.dia} <span class="text-xs text-slate-600 font-bold">mmHg (脈搏:${r.pulse})</span></div>
          </div>
          <button onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-rose-100 hover:bg-rose-200 px-3 py-1.5 rounded-lg border border-rose-300 shadow">刪除</button>
        </div>
      `).join('');
      updateChart(records);
    }

    function renderPainUI(records) {
      const list = document.getElementById('pain-history-list');
      list.innerHTML = records.length === 0 ? '<div class="text-slate-500 font-bold text-center py-3">尚無疼痛紀錄</div>' : records.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-100 rounded-xl border border-slate-300 shadow-sm">
          <div>
            <span class="text-xs font-black text-[#1b4d3e]">${r.time}</span>
            <div class="text-base font-black text-slate-900">部位：${r.part} (疼痛度: ${r.level}分)</div>
            <div class="text-xs text-slate-700 font-bold">${r.note || ''}</div>
          </div>
          <button onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-rose-100 px-3 py-1.5 rounded-lg border border-rose-300">刪除</button>
        </div>
      `).join('');
    }

    function renderMedUI(records) {
      const list = document.getElementById('med-history-list');
      list.innerHTML = records.length === 0 ? '<div class="text-slate-500 font-bold text-center py-3">尚無用藥紀錄</div>' : records.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-100 rounded-xl border border-slate-300 shadow-sm">
          <div>
            <span class="text-xs font-black text-[#1b4d3e]">${r.time}</span>
            <div class="text-base font-black text-slate-900">${r.name}</div>
            <div class="text-xs text-emerald-800 font-black">時段：${(r.medTimes || []).join(', ')}</div>
          </div>
          <button onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-rose-100 px-3 py-1.5 rounded-lg border border-rose-300">刪除</button>
        </div>
      `).join('');
    }

    function renderCalUI(records) {
      const list = document.getElementById('cal-history-list');
      list.innerHTML = records.length === 0 ? '<div class="text-slate-500 font-bold text-center py-3">尚無行事曆事件</div>' : records.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-100 rounded-xl border border-slate-300 shadow-sm">
          <div>
            <span class="text-xs font-black text-indigo-900">日期：${r.date}</span>
            <div class="text-base font-black text-slate-900">${r.title}</div>
          </div>
          <button onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-rose-100 px-3 py-1.5 rounded-lg border border-rose-300">刪除</button>
        </div>
      `).join('');
    }

    async function deleteRecord(id) {
      if (confirm("確定要刪除這筆紀錄嗎？")) {
        try {
          await db.collection("health_records").doc(id).delete();
          loadUserData();
        } catch (e) { alert("刪除失敗"); }
      }
    }

    let bpChart;
    function initChart() {
      const ctx = document.getElementById('bpChart').getContext('2d');
      bpChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function updateChart(records) {
      if (!bpChart) return;
      const recent = [...records].reverse().slice(-14);
      bpChart.data.labels = recent.map(r => `${r.date ? r.date.slice(5) : ''} ${r.slot || ''}`);
      bpChart.data.datasets = [
        { label: '收縮壓', data: recent.map(r => r.sys), borderColor: '#e11d48', borderWidth: 3, tension: 0.2 },
        { label: '舒張壓', data: recent.map(r => r.dia), borderColor: '#0284c7', borderWidth: 3, tension: 0.2 }
      ];
      bpChart.update();
    }
  </script>
</body>
</html>
