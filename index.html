<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>居家血壓與健康紀錄 - SheetDB 直連同步版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f0fdf4;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-keypad {
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.1s ease;
    }
    .btn-keypad:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #cbd5e1;
    }
    .body-zone-btn {
      transition: all 0.15s ease;
    }
    .body-zone-btn:active {
      transform: scale(0.95);
    }
    .body-zone-btn.selected {
      background-color: #ef4444 !important;
      color: white !important;
      border-color: #991b1b !important;
      transform: scale(1.06);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body class="pb-24">

  <!-- 頂部列：雲端同步與長輩切換 -->
  <header class="bg-emerald-700 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-heart-pulse text-2xl text-red-400"></i>
          <h1 class="text-xl font-black tracking-wide">長輩健康守護</h1>
        </div>
        <div id="sync-status" class="bg-emerald-800 text-emerald-200 text-xs px-3 py-1 rounded-full flex items-center gap-1.5 font-bold border border-emerald-600">
          <span class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></span>
          <span>🟢 SheetDB 雲端直連中</span>
        </div>
      </div>

      <!-- 切換長輩選單 -->
      <div class="flex items-center gap-2 bg-emerald-800 p-2 rounded-xl mt-1">
        <i class="fa-solid fa-user-gear text-emerald-300 ml-1"></i>
        <span class="text-sm font-bold whitespace-nowrap">目前長輩：</span>
        <select id="user-select" onchange="switchUser(this.value)" class="bg-white text-emerald-950 font-black text-lg rounded-lg px-3 py-1 flex-1 focus:outline-none">
        </select>
        <button onclick="promptAddUser()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-3 py-1 text-sm font-bold rounded-lg shadow">
          <i class="fa-solid fa-user-plus mr-1"></i>新增
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 flex flex-col gap-6">

    <!-- 頁籤導覽 -->
    <div class="grid grid-cols-3 gap-2 bg-emerald-100 p-1.5 rounded-2xl">
      <button id="tab-bp-btn" onclick="switchTab('bp')" class="py-3 font-black text-lg rounded-xl bg-white text-emerald-800 shadow">
        <i class="fa-solid fa-stethoscope mr-1"></i>測血壓
      </button>
      <button id="tab-med-btn" onclick="switchTab('med')" class="py-3 font-black text-lg rounded-xl text-emerald-700">
        <i class="fa-solid fa-pills mr-1"></i>用藥提醒
      </button>
      <button id="tab-pain-btn" onclick="switchTab('pain')" class="py-3 font-black text-lg rounded-xl text-emerald-700">
        <i class="fa-solid fa-child mr-1"></i>疼痛紀錄
      </button>
    </div>

    <!-- 1. 血壓紀錄頁籤 -->
    <section id="tab-bp" class="flex flex-col gap-6">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 border-b-2 border-emerald-100 pb-2 mb-4 flex items-center justify-between">
          <span><i class="fa-solid fa-pen-to-square text-emerald-600 mr-2"></i>輸入測量數值</span>
          <span class="text-xs text-gray-500 font-normal">支援日期與脈搏鍵盤輸入</span>
        </h2>

        <!-- 日期與時間自訂調動區塊 -->
        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-200 mb-4">
          <div class="text-xs font-black text-emerald-800 mb-2 flex items-center">
            <i class="fa-solid fa-calendar-days text-emerald-600 mr-1.5"></i> 測量日期與時間調動：
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-gray-600 mb-0.5">日期：</label>
              <input type="date" id="bp-date-input" class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-bold text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-gray-600 mb-0.5">時間：</label>
              <input type="time" id="bp-time-input" class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-bold text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <button id="time-morning" onclick="setTimeSlot('morning')" class="py-3 rounded-2xl font-black text-lg border-2 border-amber-400 bg-amber-50 text-amber-800 flex items-center justify-center gap-2">
            <i class="fa-solid fa-sun text-amber-500"></i> 早上測量
          </button>
          <button id="time-evening" onclick="setTimeSlot('evening')" class="py-3 rounded-2xl font-black text-lg border-2 border-slate-200 bg-slate-50 text-slate-600 flex items-center justify-center gap-2">
            <i class="fa-solid fa-moon text-indigo-500"></i> 晚上測量
          </button>
        </div>

        <!-- 收縮壓與舒張壓 -->
        <div class="grid grid-cols-2 gap-4 mb-3">
          <div id="box-sys" onclick="setActiveInput('sys')" class="p-3 bg-red-50 border-4 border-red-500 rounded-2xl text-center cursor-pointer relative shadow-md">
            <span class="text-xs font-bold text-red-600 block">收縮壓 (高壓)</span>
            <span id="val-sys" class="text-4xl font-black text-red-700 my-1 block">120</span>
            <div class="flex justify-center gap-1 mt-1">
              <button onclick="event.stopPropagation(); adjustVal('sys', -5)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">-5</button>
              <button onclick="event.stopPropagation(); adjustVal('sys', -1)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">-1</button>
              <button onclick="event.stopPropagation(); adjustVal('sys', 1)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">+1</button>
              <button onclick="event.stopPropagation(); adjustVal('sys', 5)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">+5</button>
            </div>
          </div>

          <div id="box-dia" onclick="setActiveInput('dia')" class="p-3 bg-blue-50 border-2 border-blue-200 rounded-2xl text-center cursor-pointer relative opacity-70">
            <span class="text-xs font-bold text-blue-600 block">舒張壓 (低壓)</span>
            <span id="val-dia" class="text-4xl font-black text-blue-700 my-1 block">80</span>
            <div class="flex justify-center gap-1 mt-1">
              <button onclick="event.stopPropagation(); adjustVal('dia', -5)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">-5</button>
              <button onclick="event.stopPropagation(); adjustVal('dia', -1)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">-1</button>
              <button onclick="event.stopPropagation(); adjustVal('dia', 1)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">+1</button>
              <button onclick="event.stopPropagation(); adjustVal('dia', 5)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">+5</button>
            </div>
          </div>
        </div>

        <!-- 脈搏輸入框 -->
        <div id="box-pulse" onclick="setActiveInput('pulse')" class="p-3 bg-rose-50 border-2 border-rose-200 rounded-2xl text-center cursor-pointer relative opacity-70 mb-4">
          <span class="text-xs font-bold text-rose-600 block"><i class="fa-solid fa-heart-pulse text-red-500 mr-1"></i>脈搏 (心跳/分) - 點擊可使用下方數字鍵輸入</span>
          <span id="val-pulse" class="text-3xl font-black text-rose-700 my-1 block">72</span>
          <div class="flex justify-center gap-1 mt-1">
            <button onclick="event.stopPropagation(); adjustVal('pulse', -5)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">-5</button>
            <button onclick="event.stopPropagation(); adjustVal('pulse', -1)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">-1</button>
            <button onclick="event.stopPropagation(); adjustVal('pulse', 1)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">+1</button>
            <button onclick="event.stopPropagation(); adjustVal('pulse', 5)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">+5</button>
          </div>
        </div>

        <!-- 放大版九宮格數字鍵盤 -->
        <div class="bg-slate-100 p-3 rounded-2xl mb-4">
          <div class="text-center text-xs text-slate-500 mb-2 font-bold">點選上方「收縮壓、舒張壓、脈搏」任一欄位後，用大按鈕輸入：</div>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="pressKey(1)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">1</button>
            <button onclick="pressKey(2)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">2</button>
            <button onclick="pressKey(3)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">3</button>
            <button onclick="pressKey(4)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">4</button>
            <button onclick="pressKey(5)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">5</button>
            <button onclick="pressKey(6)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">6</button>
            <button onclick="pressKey(7)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">7</button>
            <button onclick="pressKey(8)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">8</button>
            <button onclick="pressKey(9)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">9</button>
            <button onclick="pressKey('clear')" class="btn-keypad bg-amber-100 text-amber-800 text-lg font-bold py-3 rounded-xl">清除</button>
            <button onclick="pressKey(0)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">0</button>
            <button onclick="pressKey('back')" class="btn-keypad bg-slate-200 text-slate-700 text-xl font-bold py-3 rounded-xl"><i class="fa-solid fa-backspace"></i></button>
          </div>
        </div>

        <div id="bp-alert-box" class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 mb-4 flex items-start gap-3">
          <i id="bp-alert-icon" class="fa-solid fa-circle-check text-2xl text-emerald-600 mt-0.5"></i>
          <div>
            <div id="bp-alert-title" class="font-black text-emerald-900">血壓正常</div>
            <div id="bp-alert-desc" class="text-sm text-emerald-700 mt-0.5">請繼續保持良好生活作息與定時測量！</div>
          </div>
        </div>

        <button onclick="saveBPRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並同步至 Google 試算表
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 mb-3 flex items-center justify-between">
          <span><i class="fa-solid fa-chart-line text-emerald-600 mr-2"></i>血壓趨勢圖表</span>
        </h2>
        <div class="h-56 mb-4">
          <canvas id="bpChart"></canvas>
        </div>
        <h3 class="font-bold text-slate-700 mb-2 border-b pb-1">最近紀錄列表</h3>
        <div id="bp-history-list" class="flex flex-col gap-2 max-h-60 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 2. 用藥教學頁籤 -->
    <section id="tab-med" class="flex flex-col gap-6 hidden">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 border-b-2 border-emerald-100 pb-2 mb-4">
          <span><i class="fa-solid fa-capsules text-emerald-600 mr-2"></i>手動新增藥物</span>
        </h2>
        <div class="flex flex-col gap-3 mb-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">藥物名稱：</label>
            <input type="text" id="med-name" placeholder="例：脈優 (降血壓藥)" class="w-full border-2 border-slate-200 rounded-xl p-3 text-lg font-bold focus:border-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">注意事項：</label>
            <input type="text" id="med-note" placeholder="例：配溫開水" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-sm focus:border-emerald-500 focus:outline-none">
          </div>
        </div>
        <button onclick="addMedication()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg py-3 rounded-2xl shadow">
          <i class="fa-solid fa-plus-circle mr-1"></i> 新增藥物提醒
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 mb-3">長輩用藥指南</h2>
        <div id="med-list" class="flex flex-col gap-3"></div>
      </div>
    </section>

    <!-- 3. 疼痛紀錄頁籤 -->
    <section id="tab-pain" class="flex flex-col gap-6 hidden">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 border-b-2 border-emerald-100 pb-2 mb-4">
          <span><i class="fa-solid fa-street-view text-emerald-600 mr-2"></i>人體疼痛點選圖（含頭頂）</span>
        </h2>

        <!-- 人體圖區塊 (包含頭頂部位) -->
        <div id="body-view-front" class="bg-emerald-50/70 p-4 rounded-3xl border-2 border-emerald-200 mb-4">
          <div class="text-center font-black text-slate-700 text-sm mb-3">請點選部位：</div>

          <!-- 頭部 (含頭頂部位) -->
          <div class="mb-3 bg-white p-3 rounded-2xl border border-emerald-100">
            <div class="text-xs font-black text-amber-700 mb-2 text-center">頭部與顏面</div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <button onclick="selectZone('左側-頭頂/頂葉')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black selected">👈 左側頭頂</button>
              <button onclick="selectZone('右側-頭頂/頂葉')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black">👉 右側頭頂</button>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <button onclick="selectZone('左側-太陽穴')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2 rounded-xl text-xs font-black">👈 左側太陽穴</button>
              <button onclick="selectZone('右側-太陽穴')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2 rounded-xl text-xs font-black">👉 右側太陽穴</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="selectZone('左側-前額')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2 rounded-xl text-xs font-black">👈 左側前額</button>
              <button onclick="selectZone('右側-前額')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2 rounded-xl text-xs font-black">👉 右側前額</button>
            </div>
          </div>
        </div>

        <div class="text-center mb-4 font-black text-red-600 text-base bg-red-50 p-2 rounded-xl border border-red-200">
          已選擇部位：<span id="selected-zone-text" class="text-lg underline">左側-頭頂/頂葉</span>
        </div>

        <button onclick="savePainRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg py-3.5 rounded-2xl shadow-lg">
          儲存疼痛評估紀錄
        </button>
      </div>
    </section>

  </main>

  <script>
    // 您的 SheetDB API 網址
    const SHEETDB_API_URL = "https://sheetdb.io/api/v1/rd7b2ievscqzs";

    const DEFAULT_USERS = ['王爺爺', '李奶奶'];
    let currentActiveUser = '王爺爺';
    let currentInputMode = 'sys';
    let currentSlot = 'morning';
    let selectedBodyZone = '左側-頭頂/頂葉';

    window.onload = function() {
      initDefaultDateTime();
      initUserSelect();
      loadUserData();
      initChart();
    };

    function initDefaultDateTime() {
      const now = new Date();
      const currentDate = now.toISOString().split('T')[0];
      const currentTime = now.toTimeString().slice(0, 5);
      document.getElementById('bp-date-input').value = currentDate;
      document.getElementById('bp-time-input').value = currentTime;
    }

    function initUserSelect() {
      let users = JSON.parse(localStorage.getItem('bp_user_list')) || DEFAULT_USERS;
      const select = document.getElementById('user-select');
      select.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
      select.value = currentActiveUser;
    }

    function switchUser(userName) {
      currentActiveUser = userName;
      loadUserData();
    }

    function promptAddUser() {
      const name = prompt("請輸入新長輩姓名:");
      if (name && name.trim() !== "") {
        let users = JSON.parse(localStorage.getItem('bp_user_list')) || DEFAULT_USERS;
        users.push(name.trim());
        localStorage.setItem('bp_user_list', JSON.stringify(users));
        initUserSelect();
        switchUser(name.trim());
      }
    }

    function switchTab(tab) {
      ['bp', 'med', 'pain'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}-btn`).className = "py-3 font-black text-lg rounded-xl text-emerald-700";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}-btn`).className = "py-3 font-black text-lg rounded-xl bg-white text-emerald-800 shadow";
    }

    function setTimeSlot(slot) {
      currentSlot = slot;
      if (slot === 'morning') {
        document.getElementById('time-morning').className = "py-3 rounded-2xl font-black text-lg border-2 border-amber-400 bg-amber-50 text-amber-800 flex items-center justify-center gap-2";
        document.getElementById('time-evening').className = "py-3 rounded-2xl font-black text-lg border-2 border-slate-200 bg-slate-50 text-slate-600 flex items-center justify-center gap-2";
      } else {
        document.getElementById('time-evening').className = "py-3 rounded-2xl font-black text-lg border-2 border-indigo-400 bg-indigo-50 text-indigo-800 flex items-center justify-center gap-2";
        document.getElementById('time-morning').className = "py-3 rounded-2xl font-black text-lg border-2 border-slate-200 bg-slate-50 text-slate-600 flex items-center justify-center gap-2";
      }
    }

    function setActiveInput(mode) {
      currentInputMode = mode;
      document.getElementById('box-sys').className = mode === 'sys' ? "p-3 bg-red-50 border-4 border-red-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-red-50 border-2 border-red-200 rounded-2xl text-center cursor-pointer opacity-70";
      document.getElementById('box-dia').className = mode === 'dia' ? "p-3 bg-blue-50 border-4 border-blue-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-blue-50 border-2 border-blue-200 rounded-2xl text-center cursor-pointer opacity-70";
      document.getElementById('box-pulse').className = mode === 'pulse' ? "p-3 bg-rose-50 border-4 border-rose-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-rose-50 border-2 border-rose-200 rounded-2xl text-center cursor-pointer opacity-70";
    }

    function adjustVal(type, delta) {
      const el = document.getElementById(`val-${type}`);
      let val = parseInt(el.innerText) + delta;
      if (val < 30) val = 30;
      if (val > 250) val = 250;
      el.innerText = val;
    }

    function pressKey(key) {
      const el = document.getElementById(`val-${currentInputMode}`);
      let cur = el.innerText;
      if (key === 'clear') {
        el.innerText = '0';
      } else if (key === 'back') {
        el.innerText = cur.length > 1 ? cur.slice(0, -1) : '0';
      } else {
        el.innerText = cur === '0' ? String(key) : cur + key;
      }
    }

    function saveBPRecord() {
      const sys = parseInt(document.getElementById('val-sys').innerText);
      const dia = parseInt(document.getElementById('val-dia').innerText);
      const pulse = parseInt(document.getElementById('val-pulse').innerText);
      const dateVal = document.getElementById('bp-date-input').value;
      const timeVal = document.getElementById('bp-time-input').value;

      const record = {
        id: Date.now(),
        date: dateVal,
        time: timeVal,
        slot: currentSlot === 'morning' ? '早上' : '晚上',
        sys, dia, pulse
      };

      // 儲存至本機
      let records = JSON.parse(localStorage.getItem(`bp_${currentActiveUser}`)) || [];
      records.unshift(record);
      localStorage.setItem(`bp_${currentActiveUser}`, JSON.stringify(records));

      // 透過 SheetDB 直接寫入 Google 試算表（免登入、免授權）
      fetch(SHEETDB_API_URL, {
        method: "POST",
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          data: [{
            "時間": `${record.date} ${record.time}`,
            "長輩": currentActiveUser,
            "收縮壓": sys,
            "舒張壓": dia,
            "脈搏": pulse,
            "時段": record.slot,
            "備註": "血壓紀錄"
          }]
        })
      })
      .then(res => res.json())
      .then(data => alert(`已成功儲存並自動同步至 Google 試算表！`))
      .catch(err => alert("已儲存至本機紀錄！"));

      loadUserData();
    }

    function selectZone(zoneName) {
      selectedBodyZone = zoneName;
      document.getElementById('selected-zone-text').innerText = zoneName;
      const btns = document.querySelectorAll('.body-zone-btn');
      btns.forEach(b => {
        if (b.getAttribute('onclick').includes(zoneName)) {
          b.classList.add('selected');
        } else {
          b.classList.remove('selected');
        }
      });
    }

    function savePainRecord() {
      const dateVal = document.getElementById('bp-date-input').value;
      const timeVal = document.getElementById('bp-time-input').value;

      fetch(SHEETDB_API_URL, {
        method: "POST",
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          data: [{
            "時間": `${dateVal} ${timeVal}`,
            "長輩": currentActiveUser,
            "收縮壓": 0,
            "舒張壓": 0,
            "脈搏": 0,
            "時段": "疼痛紀錄",
            "備註": `部位:${selectedBodyZone}`
          }]
        })
      })
      .then(res => res.json())
      .then(data => alert("已成功儲存疼痛紀錄至 Google 試算表！"))
      .catch(err => alert("已儲存疼痛紀錄！"));
    }

    function addMedication() {
      const name = document.getElementById('med-name').value.trim();
      const note = document.getElementById('med-note').value.trim();
      if (!name) { alert("請輸入藥物名稱！"); return; }
      
      let meds = JSON.parse(localStorage.getItem(`med_${currentActiveUser}`)) || [];
      meds.push({ name, note });
      localStorage.setItem(`med_${currentActiveUser}`, JSON.stringify(meds));
      document.getElementById('med-name').value = '';
      document.getElementById('med-note').value = '';
      alert("成功新增用藥提醒！");
      loadUserData();
    }

    function loadUserData() {
      const bpRecords = JSON.parse(localStorage.getItem(`bp_${currentActiveUser}`)) || [];
      const bpList = document.getElementById('bp-history-list');
      bpList.innerHTML = bpRecords.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border">
          <div>
            <span class="text-xs font-bold text-emerald-700">${r.date} ${r.time} (${r.slot})</span>
            <div class="text-lg font-black text-slate-800">
              ${r.sys} / ${r.dia} mmHg (脈搏:${r.pulse})
            </div>
          </div>
        </div>
      `).join('');

      const meds = JSON.parse(localStorage.getItem(`med_${currentActiveUser}`)) || [];
      const medList = document.getElementById('med-list');
      medList.innerHTML = meds.length === 0 ? '<div class="text-gray-400 text-center">尚無用藥提醒</div>' : meds.map(m => `
        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200">
          <div class="font-black text-emerald-950">${m.name}</div>
          <div class="text-xs text-emerald-700 font-bold">${m.note || ''}</div>
        </div>
      `).join('');
    }

    let bpChart;
    function initChart() {
      const ctx = document.getElementById('bpChart').getContext('2d');
      bpChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  </script>
</body>
</html>
