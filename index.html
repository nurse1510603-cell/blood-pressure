<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長輩健康守護與行事曆 - Firebase 雲端同步版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (Compat 輕量版) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    html { touch-action: manipulation; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f2f7f5;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-keypad { box-shadow: 0 4px 0 #cbd5e1; transition: all 0.1s ease; }
    .btn-keypad:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e1; }
    .step-btn.active { background-color: #3b6e5c !important; color: white !important; border-color: #2c5244 !important; }
    .side-btn.active { background-color: #4a7c8c !important; color: white !important; border-color: #375e6b !important; }
    .detail-btn.active { background-color: #c95b5b !important; color: white !important; border-color: #9e4242 !important; transform: scale(1.04); }
    .med-time-checkbox:checked + label { background-color: #3b6e5c; color: white; border-color: #2c5244; }
  </style>
</head>
<body class="pb-28">

  <header class="bg-[#3b6e5c] text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-heart-pulse text-2xl text-rose-300"></i>
          <h1 class="text-xl font-black tracking-wide">長輩健康守護 (Firebase)</h1>
        </div>
        <div id="sync-status-badge" class="bg-[#2c5244] text-emerald-100 text-xs px-3 py-1 rounded-full flex items-center gap-1.5 font-bold border border-emerald-500/40">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-300 animate-pulse"></span>
          <span>🟢 Firebase 連線中</span>
        </div>
      </div>

      <div class="flex items-center gap-2 bg-[#2c5244] p-2 rounded-xl mt-1">
        <i class="fa-solid fa-user-gear text-emerald-200 ml-1"></i>
        <span class="text-sm font-bold whitespace-nowrap">目前長輩：</span>
        <select id="user-select" onchange="switchUser(this.value)" class="bg-white text-slate-900 font-black text-lg rounded-lg px-3 py-1 flex-1 focus:outline-none">
        </select>
        <button type="button" onclick="promptAddUser()" class="bg-[#528f79] hover:bg-[#62a38b] active:bg-[#3b6e5c] text-white px-3.5 py-1.5 text-sm font-bold rounded-lg shadow cursor-pointer">
          <i class="fa-solid fa-user-plus mr-1"></i>新增
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 flex flex-col gap-6">
    <div class="grid grid-cols-4 gap-1.5 bg-[#dce8e3] p-1.5 rounded-2xl text-center">
      <button id="tab-bp-btn" onclick="switchTab('bp')" class="py-2.5 font-black text-sm rounded-xl bg-white text-[#2c5244] shadow"><i class="fa-solid fa-stethoscope block text-base mb-0.5"></i>血壓</button>
      <button id="tab-pain-btn" onclick="switchTab('pain')" class="py-2.5 font-black text-sm rounded-xl text-[#3b6e5c]"><i class="fa-solid fa-child block text-base mb-0.5"></i>疼痛</button>
      <button id="tab-med-btn" onclick="switchTab('med')" class="py-2.5 font-black text-sm rounded-xl text-[#3b6e5c]"><i class="fa-solid fa-pills block text-base mb-0.5"></i>用藥</button>
      <button id="tab-cal-btn" onclick="switchTab('cal')" class="py-2.5 font-black text-sm rounded-xl text-[#3b6e5c]"><i class="fa-solid fa-calendar-days block text-base mb-0.5"></i>行事曆</button>
    </div>

    <!-- 1. 血壓頁籤 -->
    <section id="tab-bp" class="flex flex-col gap-6">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-[#dce8e3]">
        <h2 class="text-xl font-black text-[#2c5244] border-b-2 border-[#edf4f1] pb-2 mb-4 flex items-center justify-between">
          <span><i class="fa-solid fa-pen-to-square text-[#3b6e5c] mr-2"></i>輸入血壓數值</span>
        </h2>
        <div class="bg-[#f2f7f5] p-3 rounded-2xl border border-[#cde0d8] mb-4">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-[11px] font-bold text-gray-600 mb-0.5">日期：</label><input type="date" id="bp-date-input" class="w-full bg-white border rounded-xl p-2 font-bold text-sm"></div>
            <div><label class="block text-[11px] font-bold text-gray-600 mb-0.5">時間：</label><input type="time" id="bp-time-input" class="w-full bg-white border rounded-xl p-2 font-bold text-sm"></div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <button id="time-morning" onclick="setTimeSlot('morning')" class="py-3 rounded-2xl font-black text-base border-2 border-amber-400 bg-amber-50 text-amber-800"><i class="fa-solid fa-sun text-amber-500"></i> 早上</button>
          <button id="time-evening" onclick="setTimeSlot('evening')" class="py-3 rounded-2xl font-black text-base border-2 border-slate-200 bg-slate-50 text-slate-600"><i class="fa-solid fa-moon text-indigo-500"></i> 晚上</button>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-3">
          <div id="box-sys" onclick="setActiveInput('sys')" class="p-3 bg-rose-50 border-4 border-rose-500 rounded-2xl text-center cursor-pointer shadow-md">
            <span class="text-xs font-bold text-rose-700 block">收縮壓</span>
            <span id="val-sys" class="text-4xl font-black text-rose-800 my-1 block">120</span>
          </div>
          <div id="box-dia" onclick="setActiveInput('dia')" class="p-3 bg-sky-50 border-2 border-sky-200 rounded-2xl text-center cursor-pointer opacity-70">
            <span class="text-xs font-bold text-sky-700 block">舒張壓</span>
            <span id="val-dia" class="text-4xl font-black text-sky-800 my-1 block">80</span>
          </div>
        </div>
        <div id="box-pulse" onclick="setActiveInput('pulse')" class="p-3 bg-amber-50/70 border-2 border-amber-200 rounded-2xl text-center cursor-pointer opacity-70 mb-4">
          <span class="text-xs font-bold text-amber-800 block">脈搏</span>
          <span id="val-pulse" class="text-3xl font-black text-amber-900 my-1 block">72</span>
        </div>
        <div class="bg-slate-100 p-3 rounded-2xl mb-4">
          <div class="grid grid-cols-3 gap-2">
            <button onclick="pressKey(1)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">1</button>
            <button onclick="pressKey(2)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">2</button>
            <button onclick="pressKey(3)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">3</button>
            <button onclick="pressKey(4)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">4</button>
            <button onclick="pressKey(5)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">5</button>
            <button onclick="pressKey(6)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">6</button>
            <button onclick="pressKey(7)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">7</button>
            <button onclick="pressKey(8)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">8</button>
            <button onclick="pressKey(9)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">9</button>
            <button onclick="pressKey('clear')" class="btn-keypad bg-amber-100 text-amber-800 text-lg font-bold py-3 rounded-xl">清除</button>
            <button onclick="pressKey(0)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl">0</button>
            <button onclick="pressKey('back')" class="btn-keypad bg-slate-200 text-slate-700 text-xl font-bold py-3 rounded-xl"><i class="fa-solid fa-backspace"></i></button>
          </div>
        </div>
        <button onclick="saveBPRecord()" class="w-full bg-[#3b6e5c] hover:bg-[#2c5244] text-white font-black text-xl py-4 rounded-2xl shadow-lg">
          <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並同步至 Firebase
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-[#dce8e3]">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xl font-black text-[#2c5244]"><i class="fa-solid fa-chart-line text-[#3b6e5c] mr-2"></i>血壓趨勢與歷史</h2>
          <button onclick="loadUserData()" class="bg-[#dce8e3] text-[#2c5244] text-xs font-bold px-3 py-1.5 rounded-xl"><i class="fa-solid fa-rotate mr-1"></i>重新整理</button>
        </div>
        <div class="h-56 mb-4"><canvas id="bpChart"></canvas></div>
        <div id="bp-history-list" class="flex flex-col gap-2 max-h-72 overflow-y-auto"></div>
      </div>
    </section>
  </main>

  <script>
    // 💡 請將您剛剛從 Firebase 複製的專屬設定貼在下方大括號內：
    const firebaseConfig = {// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAVcMCi29gTxzbgNzLMqTPiT4EEZ40QTIo",
  authDomain: "elder-health-tracker.firebaseapp.com",
  projectId: "elder-health-tracker",
  storageBucket: "elder-health-tracker.firebasestorage.app",
  messagingSenderId: "633495130100",
  appId: "1:633495130100:web:b3771babd81c56910ab3a1",
  measurementId: "G-5H22X5TH1N"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DEFAULT_USERS = ['王爺爺', '李奶奶'];
    let currentActiveUser = '王爺爺';
    let currentInputMode = 'sys';
    let currentSlot = 'morning';

    window.onload = function() {
      initDefaultDateTime();
      initUserSelect();
      initChart();
      loadUserData();
    };

    function initDefaultDateTime() {
      const now = new Date();
      document.getElementById('bp-date-input').value = now.toISOString().split('T')[0];
      document.getElementById('bp-time-input').value = now.toTimeString().slice(0, 5);
    }

    function initUserSelect() {
      let users = JSON.parse(localStorage.getItem('bp_user_list')) || [...DEFAULT_USERS];
      const select = document.getElementById('user-select');
      select.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
      if (!users.includes(currentActiveUser)) currentActiveUser = users[0];
      select.value = currentActiveUser;
    }

    function switchUser(userName) {
      currentActiveUser = userName;
      loadUserData();
    }

    function promptAddUser() {
      const name = prompt("請輸入新長輩姓名:");
      if (name && name.trim() !== "") {
        let users = JSON.parse(localStorage.getItem('bp_user_list')) || [...DEFAULT_USERS];
        if (!users.includes(name.trim())) {
          users.push(name.trim());
          localStorage.setItem('bp_user_list', JSON.stringify(users));
        }
        currentActiveUser = name.trim();
        initUserSelect();
        loadUserData();
      }
    }

    function switchTab(tab) {
      // 基本切換保留
    }

    function setTimeSlot(slot) {
      currentSlot = slot;
      document.getElementById('time-morning').className = slot === 'morning' ? "py-3 rounded-2xl font-black text-base border-2 border-amber-400 bg-amber-50 text-amber-800" : "py-3 rounded-2xl font-black text-base border-2 border-slate-200 bg-slate-50 text-slate-600";
      document.getElementById('time-evening').className = slot === 'evening' ? "py-3 rounded-2xl font-black text-base border-2 border-indigo-400 bg-indigo-50 text-indigo-800" : "py-3 rounded-2xl font-black text-base border-2 border-slate-200 bg-slate-50 text-slate-600";
    }

    function setActiveInput(mode) {
      currentInputMode = mode;
      document.getElementById('box-sys').className = mode === 'sys' ? "p-3 bg-rose-50 border-4 border-rose-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-rose-50 border-2 border-rose-200 rounded-2xl text-center cursor-pointer opacity-70";
      document.getElementById('box-dia').className = mode === 'dia' ? "p-3 bg-sky-50 border-4 border-sky-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-sky-50 border-2 border-sky-200 rounded-2xl text-center cursor-pointer opacity-70";
      document.getElementById('box-pulse').className = mode === 'pulse' ? "p-3 bg-amber-50/70 border-4 border-amber-500 rounded-2xl text-center cursor-pointer shadow-md mb-4" : "p-3 bg-amber-50/70 border-2 border-amber-200 rounded-2xl text-center cursor-pointer opacity-70 mb-4";
    }

    function pressKey(key) {
      const el = document.getElementById(`val-${currentInputMode}`);
      let cur = el.innerText;
      if (key === 'clear') el.innerText = '0';
      else if (key === 'back') el.innerText = cur.length > 1 ? cur.slice(0, -1) : '0';
      else el.innerText = cur === '0' ? String(key) : cur + key;
    }

    async function saveBPRecord() {
      const sys = parseInt(document.getElementById('val-sys').innerText);
      const dia = parseInt(document.getElementById('val-dia').innerText);
      const pulse = parseInt(document.getElementById('val-pulse').innerText);
      const dateVal = document.getElementById('bp-date-input').value;
      const timeVal = document.getElementById('bp-time-input').value;
      const fullTimeStr = `${dateVal} ${timeVal}`;

      const record = {
        time: fullTimeStr,
        user: currentActiveUser,
        sys: sys,
        dia: dia,
        pulse: pulse,
        slot: currentSlot === 'morning' ? '早上' : '晚上',
        type: 'bp',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection("health_records").add(record);
        alert(`已成功儲存並同步 ${currentActiveUser} 的血壓紀錄至 Firebase！`);
        loadUserData();
      } catch (error) {
        console.error("Firebase 寫入失敗: ", error);
        alert("儲存失敗，請檢查網路連線。");
      }
    }

    async function loadUserData() {
      const badge = document.getElementById('sync-status-badge');
      if (badge) badge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-300 animate-ping"></span><span>🔄 同步中...</span>`;

      try {
        const snapshot = await db.collection("health_records")
          .where("user", "==", currentActiveUser)
          .orderBy("time", "desc")
          .get();

        const bpRecords = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.type === 'bp' || data.sys) {
            bpRecords.push({
              id: doc.id,
              date: data.time.split(' ')[0],
              time: data.time.split(' ')[1],
              fullTime: data.time,
              slot: data.slot,
              sys: data.sys,
              dia: data.dia,
              pulse: data.pulse
            });
          }
        });

        localStorage.setItem(`bp_${currentActiveUser}`, JSON.stringify(bpRecords));
        renderBPUI(bpRecords);
        if (badge) badge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-300"></span><span>🟢 Firebase 已同步</span>`;
      } catch (e) {
        console.log("讀取錯誤:", e);
        if (badge) badge.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span><span>⚠️ 離線模式</span>`;
        const local = JSON.parse(localStorage.getItem(`bp_${currentActiveUser}`)) || [];
        renderBPUI(local);
      }
    }

    function renderBPUI(records) {
      const bpList = document.getElementById('bp-history-list');
      bpList.innerHTML = records.length === 0 ? '<div class="text-gray-400 text-center py-3">尚無血壓紀錄</div>' : records.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border">
          <div>
            <span class="text-xs font-bold text-[#3b6e5c]">${r.date} ${r.time} (${r.slot})</span>
            <div class="text-xl font-black text-slate-800">${r.sys} / ${r.dia} <span class="text-xs text-slate-500 font-normal">mmHg (脈搏:${r.pulse})</span></div>
          </div>
          <button onclick="deleteRecord('${r.id}')" class="text-rose-600 text-xs font-bold bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200">刪除</button>
        </div>
      `).join('');
      updateChart(records);
    }

    async function deleteRecord(id) {
      if (confirm("確定要刪除這筆紀錄嗎？")) {
        try {
          await db.collection("health_records").doc(id).delete();
          loadUserData();
        } catch (e) {
          alert("刪除失敗");
        }
      }
    }

    let bpChart;
    function initChart() {
      const ctx = document.getElementById('bpChart').getContext('2d');
      bpChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function updateChart(records) {
      if (!bpChart) return;
      const recent = [...records].reverse().slice(-14);
      bpChart.data.labels = recent.map(r => `${r.date.slice(5)} ${r.slot}`);
      bpChart.data.datasets = [
        { label: '收縮壓', data: recent.map(r => r.sys), borderColor: '#d9534f', tension: 0.2 },
        { label: '舒張壓', data: recent.map(r => r.dia), borderColor: '#4a7c8c', tension: 0.2 }
      ];
      bpChart.update();
    }
  </script>
</body>
</html>
