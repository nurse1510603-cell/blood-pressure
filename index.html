<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長輩健康守護與行事曆 - 全功能修復版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* =================================================================
       🎨 【顏色自訂區】高飽和度鮮豔明亮色彩配置
       ================================================================= */
    :root {
      --bg-page: #eff6f3;          /* 背景色 */
      --header-bg: #059669;        /* 頂部標題列 */
      --header-sub: #047857;       /* 長輩選擇列 */
      --btn-primary: #0284c7;      /* 主要按鈕 */
      --tab-active-bg: #ea580c;    /* 啟動分頁 */
    }

    html { touch-action: manipulation; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-page);
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-header { background-color: var(--header-bg); }
    .theme-header-sub { background-color: var(--header-sub); }
    .theme-btn-save { background-color: var(--btn-primary); }

    .btn-keypad { box-shadow: 0 4px 0 #cbd5e1; transition: all 0.1s ease; }
    .btn-keypad:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e1; }

    /* 頁籤按鈕樣式 */
    .tab-btn { background-color: #ffffff; color: #475569; border: 2px solid #cbd5e1; }
    .tab-btn.active {
      background-color: var(--tab-active-bg) !important;
      color: #ffffff !important;
      border-color: #c2410c !important;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.4);
      transform: translateY(-2px);
    }

    /* 勾選標籤互動樣式 */
    .chip-checkbox:checked + label {
      background-color: #0284c7;
      color: white;
      border-color: #0369a1;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
    }
    .chip-radio:checked + label {
      background-color: #ea580c;
      color: white;
      border-color: #c2410c;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.4);
    }
  </style>
</head>
<body class="pb-28">

  <!-- 頂部鮮豔標題列 -->
  <header class="theme-header text-white p-4 sticky top-0 z-50 shadow-lg">
    <div class="max-w-md mx-auto flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <div class="bg-white p-1.5 rounded-full shadow">
            <i class="fa-solid fa-heart-pulse text-xl text-rose-600"></i>
          </div>
          <h1 class="text-xl font-black tracking-wide">長輩健康守護</h1>
        </div>
        <div id="sync-status-badge" class="bg-white/25 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 font-black border border-white/50">
          <span class="w-2.5 h-2.5 rounded-full bg-yellow-300 animate-pulse"></span>
          <span>連線準備中</span>
        </div>
      </div>

      <!-- 長輩切換列 -->
      <div class="flex items-center gap-2 theme-header-sub p-2.5 rounded-xl mt-1 shadow-inner">
        <i class="fa-solid fa-user-check text-yellow-300 ml-1 text-lg"></i>
        <span class="text-sm font-black whitespace-nowrap text-white">目前長輩：</span>
        <select id="user-select" class="bg-white text-slate-900 font-black text-lg rounded-lg px-3 py-1 flex-1 focus:outline-none shadow">
        </select>
        <button type="button" id="btn-add-user" class="bg-amber-400 hover:bg-amber-300 text-slate-900 px-3.5 py-1.5 text-sm font-black rounded-lg shadow cursor-pointer">
          <i class="fa-solid fa-plus mr-1"></i>新增
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 flex flex-col gap-5">

    <!-- 📌 置頂用藥提醒看板 -->
    <div id="pinned-med-banner" class="bg-gradient-to-r from-amber-100 via-yellow-50 to-orange-100 border-2 border-amber-400 rounded-2xl p-3.5 shadow-md">
      <div class="flex justify-between items-center mb-2">
        <span class="font-black text-amber-900 text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-thumbtack text-rose-600 rotate-45"></i> 置頂用藥提醒看板
        </span>
        <button type="button" id="goto-med-btn" class="text-xs font-black bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1 rounded-lg shadow-sm">
          管理藥物 <i class="fa-solid fa-chevron-right ml-0.5"></i>
        </button>
      </div>
      <div id="pinned-med-list" class="flex gap-2.5 overflow-x-auto pb-1">
        <div class="text-xs font-bold text-amber-800/80 py-1">尚無設定置頂藥物，請至「用藥」頁籤新增。</div>
      </div>
    </div>

    <!-- 四大功能導覽按鈕 -->
    <div class="grid grid-cols-4 gap-2 text-center">
      <button type="button" id="tab-bp-btn" class="tab-btn active py-3 font-black text-sm rounded-2xl transition-all">
        <i class="fa-solid fa-stethoscope block text-lg mb-1"></i>血壓
      </button>
      <button type="button" id="tab-pain-btn" class="tab-btn py-3 font-black text-sm rounded-2xl transition-all">
        <i class="fa-solid fa-person-dots-from-line block text-lg mb-1"></i>疼痛
      </button>
      <button type="button" id="tab-med-btn" class="tab-btn py-3 font-black text-sm rounded-2xl transition-all">
        <i class="fa-solid fa-pills block text-lg mb-1"></i>用藥
      </button>
      <button type="button" id="tab-cal-btn" class="tab-btn py-3 font-black text-sm rounded-2xl transition-all">
        <i class="fa-solid fa-calendar-check block text-lg mb-1"></i>行事曆
      </button>
    </div>

    <!-- ==================== 1. 血壓頁籤 ==================== -->
    <section id="tab-bp" class="tab-content flex flex-col gap-5">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-300">
        <h2 class="text-xl font-black text-emerald-800 border-b-2 border-emerald-100 pb-2 mb-4 flex items-center justify-between">
          <span><i class="fa-solid fa-heart-circle-plus text-rose-600 mr-2"></i>輸入血壓數值</span>
          <span class="text-xs bg-emerald-100 text-emerald-900 px-2.5 py-1 rounded-full font-black">國健署 722 標準</span>
        </h2>

        <div class="bg-sky-50 p-3 rounded-2xl border border-sky-200 mb-4 grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-black text-sky-950 mb-1">測量日期：</label>
            <input type="date" id="bp-date-input" class="w-full bg-white border-2 border-sky-300 rounded-xl p-2 font-black text-sm text-slate-900">
          </div>
          <div>
            <label class="block text-xs font-black text-sky-950 mb-1">測量時間：</label>
            <input type="time" id="bp-time-input" class="w-full bg-white border-2 border-sky-300 rounded-xl p-2 font-black text-sm text-slate-900">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <button type="button" id="time-morning" class="py-3 rounded-2xl font-black text-base border-2 border-amber-500 bg-amber-100 text-amber-950 shadow-sm">
            <i class="fa-solid fa-sun text-amber-600 mr-1"></i> 早上 (起床1小時內)
          </button>
          <button type="button" id="time-evening" class="py-3 rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-100 text-slate-700">
            <i class="fa-solid fa-moon text-indigo-600 mr-1"></i> 晚上 (睡前)
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div id="box-sys" class="p-3 bg-rose-50 border-4 border-rose-600 rounded-2xl text-center cursor-pointer shadow">
            <span class="text-xs font-black text-rose-800 block">收縮壓 (高壓)</span>
            <span id="val-sys" class="text-4xl font-black text-rose-700 my-1 block">118</span>
          </div>
          <div id="box-dia" class="p-3 bg-sky-50 border-2 border-sky-300 rounded-2xl text-center cursor-pointer opacity-85">
            <span class="text-xs font-black text-sky-800 block">舒張壓 (低壓)</span>
            <span id="val-dia" class="text-4xl font-black text-sky-700 my-1 block">76</span>
          </div>
        </div>
        <div id="box-pulse" class="p-2.5 bg-amber-50 border-2 border-amber-300 rounded-2xl text-center cursor-pointer opacity-85 mb-4">
          <span class="text-xs font-black text-amber-900">脈搏 (心跳/分)：</span>
          <span id="val-pulse" class="text-2xl font-black text-amber-700 ml-1">72</span>
        </div>

        <!-- 🩺 國健署血壓警語評估 -->
        <div id="bp-alert-box" class="p-4 rounded-2xl border-2 mb-4 bg-emerald-50 border-emerald-400 text-emerald-950">
          <div class="flex items-center gap-2 font-black text-base mb-1" id="bp-alert-title">
            <i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i> 血壓正常 (國健署標準)
          </div>
          <p class="text-xs font-bold leading-relaxed" id="bp-alert-desc">
            居家血壓維持在 120/80 mmHg 以下非常理想！請繼續保持。
          </p>
        </div>

        <!-- 數字鍵盤 -->
        <div class="bg-slate-200 p-3 rounded-2xl mb-4 border border-slate-300">
          <div class="grid grid-cols-3 gap-2">
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="1">1</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="2">2</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="3">3</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="4">4</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="5">5</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="6">6</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="7">7</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="8">8</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="9">9</button>
            <button type="button" class="btn-keypad key-btn bg-amber-200 text-amber-950 text-lg font-black py-3 rounded-xl" data-val="clear">清除</button>
            <button type="button" class="btn-keypad key-btn bg-white text-2xl font-black py-3 rounded-xl text-slate-900" data-val="0">0</button>
            <button type="button" class="btn-keypad key-btn bg-slate-300 text-slate-900 text-xl font-black py-3 rounded-xl" data-val="back"><i class="fa-solid fa-backspace"></i></button>
          </div>
        </div>

        <button type="button" id="save-bp-btn" class="w-full theme-btn-save hover:bg-sky-700 text-white font-black text-xl py-4 rounded-2xl shadow-lg">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存血壓紀錄
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-300">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-black text-emerald-900"><i class="fa-solid fa-chart-line text-sky-600 mr-2"></i>血壓趨勢與歷史</h2>
          <button type="button" id="reload-bp-btn" class="bg-sky-100 hover:bg-sky-200 text-sky-800 text-xs font-black px-3.5 py-2 rounded-xl shadow-sm"><i class="fa-solid fa-rotate mr-1"></i>同步</button>
        </div>
        <div class="h-52 mb-4"><canvas id="bpChart"></canvas></div>
        <div id="bp-history-list" class="flex flex-col gap-2 max-h-72 overflow-y-auto"></div>
      </div>
    </section>

    <!-- ==================== 2. 疼痛紀錄頁籤 ==================== -->
    <section id="tab-pain" class="tab-content hidden flex-col gap-5">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-orange-300">
        <h2 class="text-xl font-black text-orange-700 border-b-2 border-orange-100 pb-2 mb-4">
          <i class="fa-solid fa-person-dots-from-line mr-2"></i>點選疼痛部位與狀況
        </h2>

        <div class="mb-4">
          <label class="block text-sm font-black text-slate-900 mb-2">1. 選擇大部位：</label>
          <div class="grid grid-cols-4 gap-2">
            <div><input type="radio" name="pain-major" id="pm-head" value="頭部" class="chip-radio hidden" checked><label for="pm-head" class="block text-center py-2.5 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">頭部/頸</label></div>
            <div><input type="radio" name="pain-major" id="pm-trunk" value="軀幹" class="chip-radio hidden"><label for="pm-trunk" class="block text-center py-2.5 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">軀幹/背</label></div>
            <div><input type="radio" name="pain-major" id="pm-upper" value="上肢" class="chip-radio hidden"><label for="pm-upper" class="block text-center py-2.5 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">上肢/手</label></div>
            <div><input type="radio" name="pain-major" id="pm-lower" value="下肢" class="chip-radio hidden"><label for="pm-lower" class="block text-center py-2.5 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">下肢/腳</label></div>
          </div>
        </div>

        <div class="mb-4 bg-orange-50 p-3 rounded-2xl border border-orange-200">
          <label class="block text-sm font-black text-orange-950 mb-2">2. 細部位置 (可多選)：</label>
          <div id="pain-subparts-container" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-black text-slate-900 mb-2">3. 方位 / 側別：</label>
          <div class="grid grid-cols-4 gap-2">
            <div><input type="checkbox" name="pain-side" id="ps-left" value="左側" class="chip-checkbox hidden"><label for="ps-left" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">左側</label></div>
            <div><input type="checkbox" name="pain-side" id="ps-right" value="右側" class="chip-checkbox hidden"><label for="ps-right" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">右側</label></div>
            <div><input type="checkbox" name="pain-side" id="ps-both" value="雙側" class="chip-checkbox hidden"><label for="ps-both" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">雙側</label></div>
            <div><input type="checkbox" name="pain-side" id="ps-mid" value="正中" class="chip-checkbox hidden"><label for="ps-mid" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-sm cursor-pointer">正中</label></div>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-black text-slate-900 mb-2">4. 疼痛型態 (可多選)：</label>
          <div class="grid grid-cols-4 gap-2">
            <div><input type="checkbox" name="pain-type" id="pt-1" value="刺痛" class="chip-checkbox hidden"><label for="pt-1" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-xs cursor-pointer">⚡ 刺痛</label></div>
            <div><input type="checkbox" name="pain-type" id="pt-2" value="悶痛" class="chip-checkbox hidden"><label for="pt-2" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-xs cursor-pointer">☁️ 悶痛</label></div>
            <div><input type="checkbox" name="pain-type" id="pt-3" value="抽痛" class="chip-checkbox hidden"><label for="pt-3" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-xs cursor-pointer">💥 抽痛</label></div>
            <div><input type="checkbox" name="pain-type" id="pt-4" value="痠麻痛" class="chip-checkbox hidden"><label for="pt-4" class="block text-center py-2 bg-slate-100 border-2 border-slate-300 rounded-xl font-black text-xs cursor-pointer">🌀 痠麻痛</label></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label class="block text-xs font-black text-slate-900 mb-1">5. 發作頻率：</label>
            <select id="pain-freq" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-2.5 font-black text-sm text-slate-900">
              <option value="偶爾陣痛">偶爾陣痛</option>
              <option value="活動/走路時痛">活動/走路時痛</option>
              <option value="整天持續疼痛">整天持續疼痛</option>
              <option value="半夜痛醒">半夜痛醒</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-black text-slate-900 mb-1">疼痛分數 (1~10)：</label>
            <select id="pain-level" class="w-full bg-rose-50 border-2 border-rose-300 text-rose-950 rounded-xl p-2.5 font-black text-sm">
              <option value="2">2分 (輕微不適)</option>
              <option value="4" selected>4分 (中度疼痛)</option>
              <option value="6">6分 (明顯疼痛)</option>
              <option value="8">8分 (劇烈疼痛)</option>
              <option value="10">10分 (難以忍受)</option>
            </select>
          </div>
        </div>

        <div class="mb-4 bg-emerald-50 p-3 rounded-2xl border border-emerald-200">
          <label class="block text-sm font-black text-emerald-950 mb-2">6. 改善方式 / 搭配藥物 (可多選)：</label>
          <div class="grid grid-cols-3 gap-2">
            <div><input type="checkbox" name="pain-relief" id="pr-1" value="口服止痛藥" class="chip-checkbox hidden"><label for="pr-1" class="block text-center py-2 bg-white border border-emerald-300 rounded-xl font-black text-xs cursor-pointer">💊 口服止痛藥</label></div>
            <div><input type="checkbox" name="pain-relief" id="pr-2" value="貼痠痛藥布" class="chip-checkbox hidden"><label for="pr-2" class="block text-center py-2 bg-white border border-emerald-300 rounded-xl font-black text-xs cursor-pointer">🩹 貼痠痛藥布</label></div>
            <div><input type="checkbox" name="pain-relief" id="pr-3" value="熱敷舒緩" class="chip-checkbox hidden"><label for="pr-3" class="block text-center py-2 bg-white border border-emerald-300 rounded-xl font-black text-xs cursor-pointer">♨️ 熱敷舒緩</label></div>
            <div><input type="checkbox" name="pain-relief" id="pr-4" value="冰敷消腫" class="chip-checkbox hidden"><label for="pr-4" class="block text-center py-2 bg-white border border-emerald-300 rounded-xl font-black text-xs cursor-pointer">🧊 冰敷消腫</label></div>
            <div><input type="checkbox" name="pain-relief" id="pr-5" value="臥床休息" class="chip-checkbox hidden"><label for="pr-5" class="block text-center py-2 bg-white border border-emerald-300 rounded-xl font-black text-xs cursor-pointer">🛏️ 臥床休息</label></div>
            <div><input type="checkbox" name="pain-relief" id="pr-6" value="輕柔按摩" class="chip-checkbox hidden"><label for="pr-6" class="block text-center py-2 bg-white border border-emerald-300 rounded-xl font-black text-xs cursor-pointer">👐 輕柔按摩</label></div>
          </div>
          <input type="text" id="pain-note" placeholder="補充說明 (例如：吃了止痛藥後改善)" class="w-full mt-2 bg-white border border-emerald-300 rounded-xl p-2.5 text-xs font-bold text-slate-900">
        </div>

        <button type="button" id="save-pain-btn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black text-xl py-4 rounded-2xl shadow-lg">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存疼痛紀錄
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-orange-300">
        <h2 class="text-lg font-black text-orange-900 mb-3">歷史疼痛追蹤清單</h2>
        <div id="pain-history-list" class="flex flex-col gap-2.5 max-h-80 overflow-y-auto"></div>
      </div>
    </section>

    <!-- ==================== 3. 用藥頁籤 ==================== -->
    <section id="tab-med" class="tab-content hidden flex-col gap-5">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-sky-300">
        <h2 class="text-xl font-black text-sky-800 border-b-2 border-sky-100 pb-2 mb-4">
          <i class="fa-solid fa-pills text-sky-600 mr-2"></i>新增長輩用藥與照片
        </h2>

        <div class="mb-3">
          <label class="block text-sm font-black text-slate-900 mb-1">藥品名稱 / 用途：</label>
          <input type="text" id="med-name" placeholder="例如：降血壓藥 (1顆)" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-sm text-slate-900">
        </div>

        <div class="mb-4 bg-sky-50 p-3 rounded-2xl border border-sky-200">

        <div class="mb-4">

          <div class="grid grid-cols-4 gap-2">
            <div><input type="checkbox" name="med-time" id="mt-1" value="早餐前" class="chip-checkbox hidden"><label for="mt-1" class="block text-center py-2 bg-amber-50 border border-amber-300 rounded-xl font-black text-xs cursor-pointer">🌅 早餐前</label></div>
            <div><input type="checkbox" name="med-time" id="mt-2" value="早餐後" class="chip-checkbox hidden"><label for="mt-2" class="block text-center py-2 bg-amber-50 border border-amber-300 rounded-xl font-black text-xs cursor-pointer">☀️ 早餐後</label></div>
            <div><input type="checkbox" name="med-time" id="mt-3" value="午餐前" class="chip-checkbox hidden"><label for="mt-3" class="block text-center py-2 bg-orange-50 border border-orange-300 rounded-xl font-black text-xs cursor-pointer">🕛 午餐前</label></div>
            <div><input type="checkbox" name="med-time" id="mt-4" value="午餐後" class="chip-checkbox hidden"><label for="mt-4" class="block text-center py-2 bg-orange-50 border border-orange-300 rounded-xl font-black text-xs cursor-pointer">🌤️ 午餐後</label></div>
            <div><input type="checkbox" name="med-time" id="mt-5" value="晚餐前" class="chip-checkbox hidden"><label for="mt-5" class="block text-center py-2 bg-indigo-50 border border-indigo-300 rounded-xl font-black text-xs cursor-pointer">🌆 晚餐前</label></div>
            <div><input type="checkbox" name="med-time" id="mt-6" value="晚餐後" class="chip-checkbox hidden"><label for="mt-6" class="block text-center py-2 bg-indigo-50 border border-indigo-300 rounded-xl font-black text-xs cursor-pointer">🌙 晚餐後</label></div>
            <div><input type="checkbox" name="med-time" id="mt-7" value="睡前" class="chip-checkbox hidden"><label for="mt-7" class="block text-center py-2 bg-purple-50 border border-purple-300 rounded-xl font-black text-xs cursor-pointer">🛏️ 睡前</label></div>
            <div><input type="checkbox" name="med-time" id="mt-8" value="需要時服用" class="chip-checkbox hidden"><label for="mt-8" class="block text-center py-2 bg-rose-50 border border-rose-300 rounded-xl font-black text-xs cursor-pointer">🆘 需要時</label></div>
          </div>
        </div>

        <div class="mb-4 flex items-center gap-2 bg-amber-50 p-3 rounded-xl border border-amber-300">
          <input type="checkbox" id="med-pin-check" checked class="w-5 h-5 accent-amber-600">
          <label for="med-pin-check" class="font-black text-sm text-amber-950 cursor-pointer">
            📌 將此藥物置頂顯示在網頁最上方看板
          </label>
        </div>

        <button type="button" id="save-med-btn" class="w-full theme-btn-save hover:bg-sky-700 text-white font-black text-xl py-4 rounded-2xl shadow-lg">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存用藥設定
        </button>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-sky-300">
        <h2 class="text-lg font-black text-sky-900 mb-3">所有藥物清單</h2>
        <div id="med-history-list" class="flex flex-col gap-3 max-h-80 overflow-y-auto"></div>
      </div>

    <!-- ==================== 4. 行事曆頁籤 ==================== -->
    <section id="tab-cal" class="tab-content hidden flex-col gap-5">

            <div><input type="radio" name="cal-cat" id="cc-home" value="home" class="chip-radio hidden"><label for="cc-home" class="block text-center py-2.5 bg-emerald-50 border-2 border-emerald-300 text-emerald-900 rounded-xl font-black text-xs cursor-pointer">🏠 回家/聚餐</label></div>
            <div><input type="radio" name="cal-cat" id="cc-med" value="med" class="chip-radio hidden"><label for="cc-med" class="block text-center py-2.5 bg-sky-50 border-2 border-sky-300 text-sky-900 rounded-xl font-black text-xs cursor-pointer">💊 領慢性處方</label></div>
            <div><input type="radio" name="cal-cat" id="cc-remind" value="remind" class="chip-radio hidden"><label for="cc-remind" class="block text-center py-2.5 bg-amber-50 border-2 border-amber-300 text-amber-900 rounded-xl font-black text-xs cursor-pointer">🔔 重要提醒</label></div>
            <div><input type="radio" name="cal-cat" id="cc-exam" value="exam" class="chip-radio hidden"><label for="cc-exam" class="block text-center py-2.5 bg-purple-50 border-2 border-purple-300 text-purple-900 rounded-xl font-black text-xs cursor-pointer">💉 抽血/檢查</label></div>

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-black text-slate-900 mb-1">日期：</label>
            <input type="date" id="cal-date" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-2.5 font-black text-sm text-slate-900">

          <div>
            <label class="block text-xs font-black text-slate-900 mb-1">時間：</label>
            <input type="time" id="cal-time" value="09:00" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-2.5 font-black text-sm text-slate-900">

          <label class="block text-sm font-black text-slate-900 mb-1">事項內容：</label>
          <input type="text" id="cal-title" placeholder="例如：三軍總醫院 心臟內科" class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-black text-sm text-slate-900">
        </div>

        <button type="button" id="save-cal-btn" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-black text-xl py-4 rounded-2xl shadow-lg">
          <i class="fa-solid fa-calendar-check mr-2"></i> 新增至行事曆
        </button>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-purple-300">
        <h2 class="text-lg font-black text-purple-900 mb-3">近期行程與提醒</h2>
        <div id="cal-history-list" class="flex flex-col gap-2.5 max-h-80 overflow-y-auto"></div>
      </div>

  </main>

  <script>
    // 💡 請將您的 Firebase 設定貼在下方 (若不需要雲端可留預設)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      }
    } catch (e) { console.log("使用本機儲存備援模式"); }

    const DEFAULT_USERS = ['王爺爺', '李奶奶', '媽咪'];
    let currentActiveUser = '王爺爺';
    let currentInputMode = 'sys';
    let currentSlot = 'morning';
    let currentMedPhotoBase64 = "";

    const PAIN_SUBPARTS = {
      '頭部': ['前額/頭頂', '太陽穴', '後腦勺', '眼眶/臉部', '脖子/肩頸'],
      '軀幹': ['胸口', '上背部', '下背/腰部', '腹部/胃部', '臀部/尾椎'],
      '上肢': ['肩膀', '上臂', '手肘', '前臂', '手腕/手指'],
      '下肢': ['大腿', '膝蓋', '小腿', '腳踝', '腳底/腳趾']
    };

    const CAL_STYLES = {
      hospital: { label: '🏥 醫院回診', bg: 'bg-rose-50', border: 'border-rose-400', badge: 'bg-rose-600 text-white' },
      home:     { label: '🏠 回家/聚餐', bg: 'bg-emerald-50', border: 'border-emerald-400', badge: 'bg-emerald-600 text-white' },
      med:      { label: '💊 領慢性處方', bg: 'bg-sky-50', border: 'border-sky-400', badge: 'bg-sky-600 text-white' },
      remind:   { label: '🔔 重要提醒', bg: 'bg-amber-50', border: 'border-amber-400', badge: 'bg-amber-600 text-white' },
      exam:     { label: '💉 抽血/檢查', bg: 'bg-purple-50', border: 'border-purple-400', badge: 'bg-purple-600 text-white' },
      other:    { label: '📝 其他事項', bg: 'bg-slate-50', border: 'border-slate-300', badge: 'bg-slate-600 text-white' }
    };

    // 🛡️ 確保 DOM 載入後才綁定所有按鈕事件，徹底解決按鈕沒反應的問題
    document.addEventListener("DOMContentLoaded", function() {
      initDefaultDateTime();
      initUserSelect();
      updatePainSubParts();
      evaluateBPStatus();
      initChart();
      loadUserData();
      bindAllEvents();
    });

    function initDefaultDateTime() {
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const timeStr = now.toTimeString().slice(0, 5);
      const d1 = document.getElementById('bp-date-input');
      const d2 = document.getElementById('cal-date');
      const t1 = document.getElementById('bp-time-input');
      if(d1) d1.value = dateStr;
      if(d2) d2.value = dateStr;
      if(t1) t1.value = timeStr;
    }

    function initUserSelect() {
      let users = JSON.parse(localStorage.getItem('bp_user_list')) || [...DEFAULT_USERS];
      const select = document.getElementById('user-select');
      if (!select) return;
      select.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
      if (!users.includes(currentActiveUser)) currentActiveUser = users[0];
      select.value = currentActiveUser;
    }

    function bindAllEvents() {
      // 1. 長輩切換與新增
      document.getElementById('user-select')?.addEventListener('change', (e) => {
        currentActiveUser = e.target.value;
        loadUserData();
      });
      document.getElementById('btn-add-user')?.addEventListener('click', promptAddUser);

      // 2. 頁籤切換
      document.getElementById('tab-bp-btn')?.addEventListener('click', () => switchTab('bp'));
      document.getElementById('tab-pain-btn')?.addEventListener('click', () => switchTab('pain'));
      document.getElementById('tab-med-btn')?.addEventListener('click', () => switchTab('med'));
      document.getElementById('tab-cal-btn')?.addEventListener('click', () => switchTab('cal'));
      document.getElementById('goto-med-btn')?.addEventListener('click', () => switchTab('med'));

      // 3. 血壓時段切換
      document.getElementById('time-morning')?.addEventListener('click', () => setTimeSlot('morning'));
      document.getElementById('time-evening')?.addEventListener('click', () => setTimeSlot('evening'));

      // 4. 血壓數值方塊點擊
      document.getElementById('box-sys')?.addEventListener('click', () => setActiveInput('sys'));
      document.getElementById('box-dia')?.addEventListener('click', () => setActiveInput('dia'));
      document.getElementById('box-pulse')?.addEventListener('click', () => setActiveInput('pulse'));

      // 5. 數字鍵盤
      document.querySelectorAll('.key-btn').forEach(btn => {
        btn.addEventListener('click', () => pressKey(btn.getAttribute('data-val')));
      });

      // 6. 儲存按鈕
      document.getElementById('save-bp-btn')?.addEventListener('click', saveBPRecord);
      document.getElementById('reload-bp-btn')?.addEventListener('click', loadUserData);
      document.getElementById('save-pain-btn')?.addEventListener('click', savePainRecord);
      document.getElementById('save-med-btn')?.addEventListener('click', saveMedRecord);
      document.getElementById('save-cal-btn')?.addEventListener('click', saveCalRecord);

      // 7. 疼痛部位大項目連動
      document.querySelectorAll('input[name="pain-major"]').forEach(radio => {
        radio.addEventListener('change', updatePainSubParts);
      });

      // 8. 藥品照片上傳
      document.getElementById('med-photo-input')?.addEventListener('change', previewMedPhoto);
    }

    function promptAddUser() {
      const name = prompt("請輸入新長輩姓名:");
      if (name && name.trim() !== "") {
        let users = JSON.parse(localStorage.getItem('bp_user_list')) || [...DEFAULT_USERS];
        if (!users.includes(name.trim())) {
          users.push(name.trim());
          localStorage.setItem('bp_user_list', JSON.stringify(users));
        }
        currentActiveUser = name.trim();
        initUserSelect();
        loadUserData();
      }
    }

    function switchTab(tab) {
      ['bp', 'pain', 'med', 'cal'].forEach(t => {
        const sec = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`tab-${t}-btn`);
        if(sec) { sec.classList.add('hidden'); sec.classList.remove('flex'); }
        if(btn) btn.classList.remove('active');
      });
      const targetSec = document.getElementById(`tab-${tab}`);
      const targetBtn = document.getElementById(`tab-${tab}-btn`);
      if(targetSec) { targetSec.classList.remove('hidden'); targetSec.classList.add('flex'); }
      if(targetBtn) targetBtn.classList.add('active');
    }

    function setTimeSlot(slot) {
      currentSlot = slot;
      const mBtn = document.getElementById('time-morning');
      const eBtn = document.getElementById('time-evening');
      if(slot === 'morning') {
        if(mBtn) mBtn.className = "py-3 rounded-2xl font-black text-base border-2 border-amber-500 bg-amber-100 text-amber-950 shadow-sm";
        if(eBtn) eBtn.className = "py-3 rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-100 text-slate-700";
      } else {
        if(mBtn) mBtn.className = "py-3 rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-100 text-slate-700";
        if(eBtn) eBtn.className = "py-3 rounded-2xl font-black text-base border-2 border-indigo-500 bg-indigo-100 text-indigo-950 shadow-sm";
      }
    }

    function setActiveInput(mode) {
      currentInputMode = mode;
      const sBox = document.getElementById('box-sys');
      const dBox = document.getElementById('box-dia');
      const pBox = document.getElementById('box-pulse');
      if(sBox) sBox.className = mode === 'sys' ? "p-3 bg-rose-50 border-4 border-rose-600 rounded-2xl text-center cursor-pointer shadow" : "p-3 bg-rose-50 border-2 border-rose-300 rounded-2xl text-center cursor-pointer opacity-80";
      if(dBox) dBox.className = mode === 'dia' ? "p-3 bg-sky-50 border-4 border-sky-600 rounded-2xl text-center cursor-pointer shadow" : "p-3 bg-sky-50 border-2 border-sky-300 rounded-2xl text-center cursor-pointer opacity-80";
      if(pBox) pBox.className = mode === 'pulse' ? "p-2.5 bg-amber-50 border-4 border-amber-600 rounded-2xl text-center cursor-pointer shadow mb-4" : "p-2.5 bg-amber-50 border-2 border-amber-300 rounded-2xl text-center cursor-pointer opacity-80 mb-4";
    }

    function pressKey(key) {
      const el = document.getElementById(`val-${currentInputMode}`);
      if(!el) return;
      let cur = el.innerText;
      if (key === 'clear') el.innerText = '0';
      else if (key === 'back') el.innerText = cur.length > 1 ? cur.slice(0, -1) : '0';
      else el.innerText = cur === '0' ? String(key) : cur + key;
      evaluateBPStatus();
    }

    function evaluateBPStatus() {
      const sysEl = document.getElementById('val-sys');
      const diaEl = document.getElementById('val-dia');
      if(!sysEl || !diaEl) return;
      const sys = parseInt(sysEl.innerText) || 0;
      const dia = parseInt(diaEl.innerText) || 0;
      const box = document.getElementById('bp-alert-box');
      const title = document.getElementById('bp-alert-title');
      const desc = document.getElementById('bp-alert-desc');
      if(!box) return;

      if (sys >= 180 || dia >= 120) {
        box.className = "p-4 rounded-2xl border-2 mb-4 bg-red-100 border-red-600 text-red-950 animate-pulse";
        title.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-600 text-xl"></i> 🚨 警訊：重度高血壓危象！`;
        desc.innerText = "收縮壓 ≥180 或舒張壓 ≥120！請立刻坐下休息 5 分鐘後重測，若伴隨胸痛或頭暈請立即就醫！";
      } else if (sys >= 140 || dia >= 90) {
        box.className = "p-4 rounded-2xl border-2 mb-4 bg-rose-100 border-rose-500 text-rose-950";
        title.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-600 text-xl"></i> ⚠️ 第二期高血壓 (≥140 / ≥90)`;
        desc.innerText = "血壓明顯偏高！請遵守「722原則」測量，切勿自行停藥，並攜帶紀錄儘快回診與醫師討論。";
      } else if (sys >= 130 || dia >= 80) {
        box.className = "p-4 rounded-2xl border-2 mb-4 bg-orange-100 border-orange-500 text-orange-950";
        title.innerHTML = `<i class="fa-solid fa-bell text-orange-600 text-xl"></i> 🟠 第一期高血壓 (國健署標準 130/80)`;
        desc.innerText = "國健署最新居家血壓標準為 130/80 mmHg！已達高血壓標準，建議減鹽飲食並持續每日早晚監測。";
      } else if (sys >= 120 && sys <= 129 && dia < 80) {
        box.className = "p-4 rounded-2xl border-2 mb-4 bg-amber-100 border-amber-400 text-amber-950";
        title.innerHTML = `<i class="fa-solid fa-circle-info text-amber-600 text-xl"></i> 🟡 血壓偏高 (120~129 / <80)`;
        desc.innerText = "處於高血壓前期邊緣，建議清淡飲食、減少熬夜與規律有氧運動。";
      } else if (sys < 90 || dia < 60) {
        box.className = "p-4 rounded-2xl border-2 mb-4 bg-sky-100 border-sky-500 text-sky-950";
        title.innerHTML = `<i class="fa-solid fa-arrow-trend-down text-sky-600 text-xl"></i> 🔵 血壓偏低 (<90 / <60)`;
        desc.innerText = "血壓數值較低，起身時請放慢動作；若有頭暈無力請補充水分。";
      } else {
        box.className = "p-4 rounded-2xl border-2 mb-4 bg-emerald-50 border-emerald-400 text-emerald-950";
        title.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i> 🟢 血壓正常 (<120 / <80)`;
        desc.innerText = "符合國健署理想居家血壓標準！請繼續保持。";
      }
    }

    function updatePainSubParts() {
      const majorEl = document.querySelector('input[name="pain-major"]:checked');
      if(!majorEl) return;
      const major = majorEl.value;
      const list = PAIN_SUBPARTS[major] || [];
      const container = document.getElementById('pain-subparts-container');
      if(!container) return;
      container.innerHTML = list.map((item, idx) => `
        <div>
          <input type="checkbox" name="pain-sub" id="psub-${idx}" value="${item}" class="chip-checkbox hidden">
          <label for="psub-${idx}" class="inline-block px-3 py-1.5 bg-white border border-orange-300 rounded-xl font-black text-xs text-slate-900 cursor-pointer shadow-sm">${item}</label>
        </div>
      `).join('');
    }

    function previewMedPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 240;
          const scale = maxW / img.width;
          canvas.width = maxW;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          currentMedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
          const preview = document.getElementById('med-photo-preview');
          if(preview) {
            preview.src = currentMedPhotoBase64;
            preview.classList.remove('hidden');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveDataToStorage(record) {
      record.id = Date.now().toString();
      record.user = currentActiveUser;
      const key = `health_data_${currentActiveUser}`;
      const existing = JSON.parse(localStorage.getItem(key)) || [];
      existing.unshift(record);
      localStorage.setItem(key, JSON.stringify(existing));

      if (db) {
        try { await db.collection("health_records").add(record); } catch (e) {}
      }
      loadUserData();
    }

    function saveBPRecord() {
      const dateVal = document.getElementById('bp-date-input')?.value || '';
      const timeVal = document.getElementById('bp-time-input')?.value || '';
      const sysVal = parseInt(document.getElementById('val-sys')?.innerText) || 120;
      const diaVal = parseInt(document.getElementById('val-dia')?.innerText) || 80;
      const pulseVal = parseInt(document.getElementById('val-pulse')?.innerText) || 72;

      saveDataToStorage({
        type: 'bp',
        time: `${dateVal} ${timeVal}`,
        sys: sysVal,
        dia: diaVal,
        pulse: pulseVal,
        slot: currentSlot === 'morning' ? '早上' : '晚上'
      });
      alert("✅ 血壓紀錄已儲存成功！");
    }

    function savePainRecord() {
      const majorEl = document.querySelector('input[name="pain-major"]:checked');
      const subs = Array.from(document.querySelectorAll('input[name="pain-sub"]:checked')).map(e => e.value);
      const sides = Array.from(document.querySelectorAll('input[name="pain-side"]:checked')).map(e => e.value);
      const types = Array.from(document.querySelectorAll('input[name="pain-type"]:checked')).map(e => e.value);
      const reliefs = Array.from(document.querySelectorAll('input[name="pain-relief"]:checked')).map(e => e.value);

      saveDataToStorage({
        type: 'pain',
        time: new Date().toLocaleString('zh-TW', { hour12: false }),
        major: majorEl ? majorEl.value : '頭部',
        subs: subs.length ? subs : ['未指定細部'],
        sides: sides.length ? sides : ['未指定側別'],
        types: types.length ? types : ['一般疼痛'],
        freq: document.getElementById('pain-freq')?.value || '偶爾陣痛',
        level: document.getElementById('pain-level')?.value || '4',
        reliefs,
        note: document.getElementById('pain-note')?.value || ''
      });
      alert("✅ 疼痛紀錄已儲存成功！");
    }

    function saveMedRecord() {
      const nameInput = document.getElementById('med-name');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name) { alert("請輸入藥品名稱！"); return; }
      const times = Array.from(document.querySelectorAll('input[name="med-time"]:checked')).map(e => e.value);
      const pinCheck = document.getElementById('med-pin-check');

      saveDataToStorage({
        type: 'med',
        name,
        photo: currentMedPhotoBase64,
        medTimes: times.length ? times : ['依醫囑服用'],
        pinned: pinCheck ? pinCheck.checked : true
      });
      if(nameInput) nameInput.value = "";
      currentMedPhotoBase64 = "";
      const preview = document.getElementById('med-photo-preview');
      if(preview) preview.classList.add('hidden');
      alert("✅ 用藥設定已儲存成功！");
    }

    function saveCalRecord() {
      const titleInput = document.getElementById('cal-title');
      const title = titleInput ? titleInput.value.trim() : '';
      if (!title) { alert("請輸入行程內容！"); return; }
      const catEl = document.querySelector('input[name="cal-cat"]:checked');

      saveDataToStorage({
        type: 'cal',
        cat: catEl ? catEl.value : 'hospital',
        date: document.getElementById('cal-date')?.value || '',
        time: document.getElementById('cal-time')?.value || '',
        title
      });
      if(titleInput) titleInput.value = "";
      alert("✅ 行事曆行程已新增成功！");
    }

    window.deleteRecord = function(id) {
      if (!confirm("確定要刪除這筆紀錄嗎？")) return;
      const key = `health_data_${currentActiveUser}`;
      const existing = JSON.parse(localStorage.getItem(key)) || [];
      localStorage.setItem(key, JSON.stringify(existing.filter(item => item.id !== id)));
      loadUserData();
    };

    function loadUserData() {
      const badge = document.getElementById('sync-status-badge');
      if(badge) {
        badge.innerHTML = db
          ? `<span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span>Firebase 連線中</span>`
          : `<span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span>本機即時儲存</span>`;
      }

      const key = `health_data_${currentActiveUser}`;
      const allData = JSON.parse(localStorage.getItem(key)) || [];

      renderBPUI(allData.filter(d => d.type === 'bp'));
      renderPainUI(allData.filter(d => d.type === 'pain'));
      renderMedUI(allData.filter(d => d.type === 'med'));
      renderCalUI(allData.filter(d => d.type === 'cal'));
    }

    function renderBPUI(records) {
      const list = document.getElementById('bp-history-list');
      if(!list) return;
      list.innerHTML = records.length === 0
        ? '<div class="text-slate-400 font-bold text-center py-4">尚無血壓紀錄</div>'
        : records.map(r => {
            const isHigh = r.sys >= 130 || r.dia >= 80;
            return `
              <div class="flex items-center justify-between p-3 ${isHigh ? 'bg-rose-50 border-rose-300' : 'bg-emerald-50 border-emerald-200'} rounded-2xl border-2 shadow-sm">
                <div>
                  <span class="text-xs font-black text-slate-700">${r.time} (${r.slot})</span>
                  <div class="text-xl font-black ${isHigh ? 'text-rose-700' : 'text-emerald-900'}">
                    ${r.sys} / ${r.dia} <span class="text-xs font-bold text-slate-700">mmHg (脈搏:${r.pulse})</span>
                  </div>
                </div>
                <button type="button" onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-white px-3 py-1.5 rounded-xl border border-rose-300 shadow-sm">刪除</button>
              </div>`;
          }).join('');
      updateChart(records);
    }

    function renderPainUI(records) {
      const list = document.getElementById('pain-history-list');
      if(!list) return;
      list.innerHTML = records.length === 0
        ? '<div class="text-slate-400 font-bold text-center py-4">尚無疼痛紀錄</div>'
        : records.map(r => `
            <div class="p-3.5 bg-orange-50 rounded-2xl border-2 border-orange-200 flex justify-between items-start shadow-sm">
              <div class="flex flex-col gap-1">
                <span class="text-[11px] font-black text-orange-800">${r.time}</span>
                <div class="text-base font-black text-slate-900">
                  【${r.major}】${(r.sides || []).join('、')} - ${(r.subs || []).join('、')}
                </div>
                <div class="text-xs font-bold text-rose-800">
                  型態：${(r.types || []).join('、')} ｜ 頻率：${r.freq} ｜ 痛度：${r.level}分
                </div>
                ${r.reliefs && r.reliefs.length ? `<div class="text-xs font-black text-emerald-900 bg-white px-2 py-1 rounded-lg border border-emerald-300 inline-block mt-1">改善處置：${r.reliefs.join('、')}</div>` : ''}
                ${r.note ? `<div class="text-xs text-slate-700 font-bold">備註：${r.note}</div>` : ''}
              </div>
              <button type="button" onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-white px-2.5 py-1 rounded-lg border border-rose-300 shadow-sm">刪除</button>
            </div>
          `).join('');
    }

    function renderMedUI(records) {
      const pinned = records.filter(r => r.pinned);
      const pinBox = document.getElementById('pinned-med-list');
      if(pinBox) {
        pinBox.innerHTML = pinned.length === 0
          ? '<div class="text-xs font-bold text-amber-900 py-1">尚無設定置頂藥物，請至「用藥」頁籤新增。</div>'
          : pinned.map(r => `
              <div class="flex-shrink-0 bg-white border-2 border-amber-300 rounded-xl p-2.5 flex items-center gap-2.5 shadow-sm min-w-[200px]">
                ${r.photo ? `<img src="${r.photo}" class="w-12 h-12 rounded-lg object-cover border border-slate-300">` : `<div class="w-12 h-12 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center text-xl"><i class="fa-solid fa-pills"></i></div>`}
                <div>
                  <div class="font-black text-sm text-slate-900">${r.name}</div>
                  <div class="text-[11px] font-black text-orange-700 mt-0.5">${(r.medTimes || []).join('・')}</div>
                </div>
              </div>
            `).join('');
      }

      const list = document.getElementById('med-history-list');
      if(!list) return;
      list.innerHTML = records.length === 0
        ? '<div class="text-slate-400 font-bold text-center py-4">尚無用藥紀錄</div>'
        : records.map(r => `
            <div class="p-3 bg-sky-50 rounded-2xl border-2 border-sky-300 flex items-center justify-between gap-3 shadow-sm">
              <div class="flex items-center gap-3">
                ${r.photo ? `<img src="${r.photo}" class="w-16 h-16 rounded-xl object-cover border-2 border-white shadow">` : `<div class="w-16 h-16 rounded-xl bg-white text-sky-600 flex items-center justify-center text-2xl shadow"><i class="fa-solid fa-capsules"></i></div>`}
                <div>
                  <div class="font-black text-base text-slate-900">${r.name} ${r.pinned ? '<span class="text-xs bg-amber-400 text-slate-950 px-1.5 py-0.5 rounded ml-1 font-black">📌置頂</span>' : ''}</div>
                  <div class="flex flex-wrap gap-1 mt-1">
                    ${(r.medTimes || []).map(t => `<span class="text-xs font-black bg-sky-600 text-white px-2 py-0.5 rounded-lg">${t}</span>`).join('')}
                  </div>
                </div>
              </div>
              <button type="button" onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-white px-2.5 py-1.5 rounded-xl border border-rose-300 shadow-sm">刪除</button>
            </div>
          `).join('');
    }

    function renderCalUI(records) {
      const list = document.getElementById('cal-history-list');
      if(!list) return;
      const sorted = [...records].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      list.innerHTML = sorted.length === 0
        ? '<div class="text-slate-400 font-bold text-center py-4">尚無行事曆行程</div>'
        : sorted.map(r => {
            const st = CAL_STYLES[r.cat] || CAL_STYLES.other;
            return `
              <div class="p-3.5 ${st.bg} rounded-2xl border-2 ${st.border} flex items-center justify-between shadow-sm">
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs font-black px-2.5 py-0.5 rounded-full ${st.badge}">${st.label}</span>
                    <span class="text-xs font-black text-slate-800">${r.date} ${r.time || ''}</span>
                  </div>
                  <div class="text-base font-black text-slate-900">${r.title}</div>
                </div>
                <button type="button" onclick="deleteRecord('${r.id}')" class="text-rose-700 font-black text-xs bg-white px-2.5 py-1.5 rounded-xl border border-rose-300 shadow-sm">刪除</button>
              </div>
            `;
          }).join('');
    }

    let bpChart;
    function initChart() {
      const canvas = document.getElementById('bpChart');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      bpChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function updateChart(records) {
      if (!bpChart) return;
      const recent = [...records].reverse().slice(-14);
      bpChart.data.labels = recent.map(r => `${(r.time || '').slice(5, 10)} ${r.slot || ''}`);
      bpChart.data.datasets = [
        { label: '收縮壓', data: recent.map(r => r.sys), borderColor: '#e11d48', backgroundColor: '#e11d48', borderWidth: 3, tension: 0.25 },
        { label: '舒張壓', data: recent.map(r => r.dia), borderColor: '#0284c7', backgroundColor: '#0284c7', borderWidth: 3, tension: 0.25 }
      ];
      bpChart.update();
    }
  </script>
</body>
</html>
