<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長輩健康守護 - 完整功能、刪除修改與長輩大字版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f0fdf4;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-keypad {
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.1s ease;
    }
    .btn-keypad:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #cbd5e1;
    }
    .body-zone-btn {
      transition: all 0.15s ease;
    }
    .body-zone-btn:active {
      transform: scale(0.95);
    }
    .body-zone-btn.selected {
      background-color: #ef4444 !important;
      color: white !important;
      border-color: #991b1b !important;
      transform: scale(1.06);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body class="pb-24">

  <!-- 頂部列：雲端同步與長輩切換 -->
  <header class="bg-emerald-700 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-heart-pulse text-2xl text-red-400"></i>
          <h1 class="text-xl font-black tracking-wide">長輩健康守護</h1>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleElderMode()" id="elder-mode-btn" class="bg-amber-400 text-amber-950 text-xs px-2.5 py-1 rounded-full font-black shadow">
            👴 長輩大字模式
          </button>
          <div class="bg-emerald-800 text-emerald-200 text-xs px-2.5 py-1 rounded-full flex items-center gap-1 font-bold border border-emerald-600">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            <span>雲端同步</span>
          </div>
        </div>
      </div>

      <!-- 切換長輩選單 -->
      <div class="flex items-center gap-2 bg-emerald-800 p-2 rounded-xl mt-1">
        <i class="fa-solid fa-user-gear text-emerald-300 ml-1"></i>
        <span class="text-sm font-bold whitespace-nowrap">目前長輩：</span>
        <select id="user-select" onchange="switchUser(this.value)" class="bg-white text-emerald-950 font-black text-lg rounded-lg px-3 py-1 flex-1 focus:outline-none">
        </select>
        <button onclick="promptAddUser()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-3 py-1 text-sm font-bold rounded-lg shadow">
          <i class="fa-solid fa-user-plus mr-1"></i>新增
        </button>
      </div>
    </div>
  </header>

  <!-- 長輩專用大字長期檢視畫面 (平時隱藏，點擊切換) -->
  <div id="elder-view-modal" class="fixed inset-0 bg-emerald-950 z-50 p-5 overflow-y-auto hidden text-white">
    <div class="max-w-md mx-auto flex flex-col gap-6">
      <div class="flex justify-between items-center border-b border-emerald-800 pb-4">
        <h2 class="text-3xl font-black text-amber-300"><i class="fa-solid fa-heart-pulse mr-2"></i>給長輩的長期紀錄</h2>
        <button onclick="toggleElderMode()" class="bg-red-500 text-white font-black px-4 py-2 rounded-xl text-lg">關閉返回</button>
      </div>
      <div class="bg-emerald-900 p-5 rounded-3xl border-2 border-emerald-600">
        <h3 class="text-xl font-bold mb-2 text-emerald-200">最近血壓平均與狀況：</h3>
        <div id="elder-avg-box" class="text-2xl font-black text-white mb-4">載入中...</div>
      </div>
      <div class="bg-white text-slate-900 p-5 rounded-3xl shadow-xl">
        <h3 class="text-xl font-black text-emerald-900 mb-3 border-b pb-2">長期血壓歷史清單</h3>
        <div id="elder-history-list" class="flex flex-col gap-3 max-h-96 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4 flex flex-col gap-6">

    <!-- 頁籤導覽 (4格) -->
    <div class="grid grid-cols-4 gap-1 bg-emerald-100 p-1.5 rounded-2xl">
      <button id="tab-bp-btn" onclick="switchTab('bp')" class="py-2.5 font-black text-xs md:text-base rounded-xl bg-white text-emerald-800 shadow">
        <i class="fa-solid fa-stethoscope mr-0.5"></i>測血壓
      </button>
      <button id="tab-med-btn" onclick="switchTab('med')" class="py-2.5 font-black text-xs md:text-base rounded-xl text-emerald-700">
        <i class="fa-solid fa-pills mr-0.5"></i>用藥
      </button>
      <button id="tab-pain-btn" onclick="switchTab('pain')" class="py-2.5 font-black text-xs md:text-base rounded-xl text-emerald-700">
        <i class="fa-solid fa-child mr-0.5"></i>疼痛
      </button>
      <button id="tab-cal-btn" onclick="switchTab('cal')" class="py-2.5 font-black text-xs md:text-base rounded-xl text-emerald-700">
        <i class="fa-solid fa-calendar-check mr-0.5"></i>看診
      </button>
    </div>

    <!-- 1. 血壓紀錄頁籤 -->
    <section id="tab-bp" class="flex flex-col gap-6">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 border-b-2 border-emerald-100 pb-2 mb-4 flex items-center justify-between">
          <span><i class="fa-solid fa-pen-to-square text-emerald-600 mr-2"></i>輸入測量數值</span>
          <span class="text-xs text-gray-500 font-normal">支援修改與刪除</span>
        </h2>

        <!-- 日期與時間自訂調動 -->
        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-200 mb-4">
          <div class="text-xs font-black text-emerald-800 mb-2 flex items-center">
            <i class="fa-solid fa-calendar-days text-emerald-600 mr-1.5"></i> 測量日期與時間調動：
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-gray-600 mb-0.5">日期：</label>
              <input type="date" id="bp-date-input" class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-bold text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-gray-600 mb-0.5">時間：</label>
              <input type="time" id="bp-time-input" class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-bold text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <button id="time-morning" onclick="setTimeSlot('morning')" class="py-3 rounded-2xl font-black text-lg border-2 border-amber-400 bg-amber-50 text-amber-800 flex items-center justify-center gap-2">
            <i class="fa-solid fa-sun text-amber-500"></i> 早上測量
          </button>
          <button id="time-evening" onclick="setTimeSlot('evening')" class="py-3 rounded-2xl font-black text-lg border-2 border-slate-200 bg-slate-50 text-slate-600 flex items-center justify-center gap-2">
            <i class="fa-solid fa-moon text-indigo-500"></i> 晚上測量
          </button>
        </div>

        <!-- 收縮壓與舒張壓 -->
        <div class="grid grid-cols-2 gap-4 mb-3">
          <div id="box-sys" onclick="setActiveInput('sys')" class="p-3 bg-red-50 border-4 border-red-500 rounded-2xl text-center cursor-pointer relative shadow-md">
            <span class="text-xs font-bold text-red-600 block">收縮壓 (高壓)</span>
            <span id="val-sys" class="text-4xl font-black text-red-700 my-1 block">120</span>
            <div class="flex justify-center gap-1 mt-1">
              <button onclick="event.stopPropagation(); adjustVal('sys', -5)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">-5</button>
              <button onclick="event.stopPropagation(); adjustVal('sys', -1)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">-1</button>
              <button onclick="event.stopPropagation(); adjustVal('sys', 1)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">+1</button>
              <button onclick="event.stopPropagation(); adjustVal('sys', 5)" class="bg-white text-red-600 border border-red-300 font-bold px-2 py-1 rounded-md text-sm">+5</button>
            </div>
          </div>

          <div id="box-dia" onclick="setActiveInput('dia')" class="p-3 bg-blue-50 border-2 border-blue-200 rounded-2xl text-center cursor-pointer relative opacity-70">
            <span class="text-xs font-bold text-blue-600 block">舒張壓 (低壓)</span>
            <span id="val-dia" class="text-4xl font-black text-blue-700 my-1 block">80</span>
            <div class="flex justify-center gap-1 mt-1">
              <button onclick="event.stopPropagation(); adjustVal('dia', -5)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">-5</button>
              <button onclick="event.stopPropagation(); adjustVal('dia', -1)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">-1</button>
              <button onclick="event.stopPropagation(); adjustVal('dia', 1)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">+1</button>
              <button onclick="event.stopPropagation(); adjustVal('dia', 5)" class="bg-white text-blue-600 border border-blue-300 font-bold px-2 py-1 rounded-md text-sm">+5</button>
            </div>
          </div>
        </div>

        <!-- 脈搏輸入框 -->
        <div id="box-pulse" onclick="setActiveInput('pulse')" class="p-3 bg-rose-50 border-2 border-rose-200 rounded-2xl text-center cursor-pointer relative opacity-70 mb-4">
          <span class="text-xs font-bold text-rose-600 block"><i class="fa-solid fa-heart-pulse text-red-500 mr-1"></i>脈搏 (心跳/分)</span>
          <span id="val-pulse" class="text-3xl font-black text-rose-700 my-1 block">72</span>
          <div class="flex justify-center gap-1 mt-1">
            <button onclick="event.stopPropagation(); adjustVal('pulse', -5)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">-5</button>
            <button onclick="event.stopPropagation(); adjustVal('pulse', -1)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">-1</button>
            <button onclick="event.stopPropagation(); adjustVal('pulse', 1)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">+1</button>
            <button onclick="event.stopPropagation(); adjustVal('pulse', 5)" class="bg-white text-rose-600 border border-rose-300 font-bold px-2 py-1 rounded-md text-sm">+5</button>
          </div>
        </div>

        <!-- 九宮格鍵盤 -->
        <div class="bg-slate-100 p-3 rounded-2xl mb-4">
          <div class="text-center text-xs text-slate-500 mb-2 font-bold">點選上方欄位後，用大按鈕輸入：</div>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="pressKey(1)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">1</button>
            <button onclick="pressKey(2)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">2</button>
            <button onclick="pressKey(3)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">3</button>
            <button onclick="pressKey(4)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">4</button>
            <button onclick="pressKey(5)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">5</button>
            <button onclick="pressKey(6)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">6</button>
            <button onclick="pressKey(7)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">7</button>
            <button onclick="pressKey(8)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">8</button>
            <button onclick="pressKey(9)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">9</button>
            <button onclick="pressKey('clear')" class="btn-keypad bg-amber-100 text-amber-800 text-lg font-bold py-3 rounded-xl">清除</button>
            <button onclick="pressKey(0)" class="btn-keypad bg-white text-2xl font-black py-3 rounded-xl text-slate-800">0</button>
            <button onclick="pressKey('back')" class="btn-keypad bg-slate-200 text-slate-700 text-xl font-bold py-3 rounded-xl"><i class="fa-solid fa-backspace"></i></button>
          </div>
        </div>

        <button onclick="saveBPRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並同步至 Google 試算表
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 mb-3">血壓趨勢圖表</h2>
        <div class="h-56 mb-4">
          <canvas id="bpChart"></canvas>
        </div>
        <h3 class="font-bold text-slate-700 mb-2 border-b pb-1 flex justify-between items-center">
          <span>最近血壓紀錄清單 (支援刪除)</span>
        </h3>
        <div id="bp-history-list" class="flex flex-col gap-2 max-h-60 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 2. 用藥提醒頁籤 -->
    <section id="tab-med" class="flex flex-col gap-6 hidden">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 border-b-2 border-emerald-100 pb-2 mb-4">新增藥物提醒</h2>
        <div class="flex flex-col gap-3 mb-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">藥物名稱：</label>
            <input type="text" id="med-name" placeholder="例：脈優 (降血壓藥)" class="w-full border-2 border-slate-200 rounded-xl p-3 text-lg font-bold focus:border-emerald-500 focus:outline-none">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">服用時段：</label>
              <select id="med-time" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-base focus:border-emerald-500 focus:outline-none">
                <option value="早上吃">早上吃</option>
                <option value="中午吃">中午吃</option>
                <option value="晚上吃">晚上吃</option>
                <option value="睡前吃">睡前吃</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">注意事項：</label>
              <input type="text" id="med-note" placeholder="例：飯後服用" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-sm focus:border-emerald-500 focus:outline-none">
            </div>
          </div>
        </div>
        <button onclick="addMedication()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg py-3 rounded-2xl shadow">
          新增用藥提醒
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 mb-3">用藥指南清單</h2>
        <div id="med-list" class="flex flex-col gap-3"></div>
      </div>
    </section>

    <!-- 3. 疼痛紀錄頁籤 (完整保留所有部位、時間、頻率、形式) -->
    <section id="tab-pain" class="flex flex-col gap-6 hidden">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 border-b-2 border-emerald-100 pb-2 mb-4">人體疼痛點選圖與詳細記錄</h2>

        <!-- 時間調動 -->
        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-200 mb-4">
          <div class="text-xs font-black text-emerald-800 mb-2">疼痛發生時間調動：</div>
          <div class="grid grid-cols-2 gap-2">
            <input type="date" id="pain-date-input" class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-bold text-sm">
            <input type="time" id="pain-time-input" class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-bold text-sm">
          </div>
        </div>

        <div class="flex gap-2 mb-4">
          <button id="view-front-btn" onclick="toggleBodyView('front')" class="flex-1 py-2.5 rounded-xl font-black bg-emerald-600 text-white shadow">正面部位</button>
          <button id="view-back-btn" onclick="toggleBodyView('back')" class="flex-1 py-2.5 rounded-xl font-black bg-slate-100 text-slate-700">背面部位</button>
        </div>

        <!-- 正面人體視覺區域 -->
        <div id="body-view-front" class="bg-emerald-50/70 p-4 rounded-3xl border-2 border-emerald-200 mb-4">
          <div class="text-center font-black text-slate-700 text-sm mb-3">【正面】點選部位：</div>
          <div class="mb-3 bg-white p-3 rounded-2xl border border-emerald-100">
            <div class="text-xs font-black text-amber-700 mb-2 text-center">頭部與顏面</div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <button onclick="selectZone('左側-頭頂/頂葉')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black selected">👈 左側頭頂</button>
              <button onclick="selectZone('右側-頭頂/頂葉')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black">👉 右側頭頂</button>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <button onclick="selectZone('左側-太陽穴')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black">👈 左側太陽穴</button>
              <button onclick="selectZone('右側-太陽穴')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black">👉 右側太陽穴</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="selectZone('左側-前額')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black">👈 左側前額</button>
              <button onclick="selectZone('右側-前額')" class="body-zone-btn bg-amber-50 border border-amber-300 text-amber-900 p-2.5 rounded-xl text-xs font-black">👉 右側前額</button>
            </div>
          </div>
          <div class="mb-3 bg-white p-3 rounded-2xl border border-emerald-100">
            <div class="text-xs font-black text-blue-700 mb-2 text-center">手部與關節</div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="selectZone('左手肘/上臂')" class="body-zone-btn bg-blue-50 border border-blue-300 text-blue-900 p-2.5 rounded-xl text-xs font-black">👈 左手上臂/肘</button>
              <button onclick="selectZone('右手肘/上臂')" class="body-zone-btn bg-blue-50 border border-blue-300 text-blue-900 p-2.5 rounded-xl text-xs font-black">👉 右手上臂/肘</button>
            </div>
          </div>
          <div class="bg-white p-3 rounded-2xl border border-emerald-100">
            <div class="text-xs font-black text-emerald-700 mb-2 text-center">腿部與膝蓋</div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="selectZone('左腳膝蓋')" class="body-zone-btn bg-emerald-50 border border-emerald-300 text-emerald-900 p-2.5 rounded-xl text-xs font-black">🦵 左膝蓋</button>
              <button onclick="selectZone('右腳膝蓋')" class="body-zone-btn bg-emerald-50 border border-emerald-300 text-emerald-900 p-2.5 rounded-xl text-xs font-black">🦵 右膝蓋</button>
            </div>
          </div>
        </div>

        <!-- 背面人體視覺區域 -->
        <div id="body-view-back" class="bg-slate-100 p-4 rounded-3xl border-2 border-slate-200 mb-4 hidden">
          <div class="text-center font-black text-slate-700 text-sm mb-3">【背面】點選部位：</div>
          <div class="bg-white p-3 rounded-2xl border border-slate-200">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="selectZone('左側-後腦勺')" class="body-zone-btn bg-slate-50 border border-slate-300 text-slate-900 p-2 rounded-xl text-xs font-black">👈 左側後腦</button>
              <button onclick="selectZone('右側-後腦勺')" class="body-zone-btn bg-slate-50 border border-slate-300 text-slate-900 p-2 rounded-xl text-xs font-black">👉 右側後腦</button>
            </div>
          </div>
        </div>

        <div class="text-center mb-4 font-black text-red-600 text-base bg-red-50 p-2 rounded-xl border border-red-200">
          已選擇部位：<span id="selected-zone-text" class="text-lg underline">左側-頭頂/頂葉</span>
        </div>

        <!-- 疼痛程度與 10 種形式 -->
        <div class="my-4">
          <label class="block font-black text-slate-800 mb-2">👉 疼痛程度 (1-10分)：</label>
          <div class="flex justify-between items-center bg-slate-100 p-3 rounded-2xl mb-2">
            <span class="text-4xl" id="pain-emoji">😊</span>
            <span id="pain-score-display" class="text-2xl font-black text-emerald-700">1 分 (輕微)</span>
          </div>
          <input type="range" id="pain-score" min="1" max="10" value="1" oninput="updatePainDisplay(this.value)" class="w-full h-4 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600">
        </div>

        <div class="grid grid-cols-1 gap-3 mb-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">疼痛形式 (10種選項)：</label>
            <select id="pain-type" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-base focus:border-emerald-500">
              <option value="💓 抽痛 / 血管脈搏跳動痛">💓 抽痛 / 血管脈搏跳動痛</option>
              <option value="📍 刺痛 / 像針扎感">📍 刺痛 / 像針扎感</option>
              <option value="🪨 悶痛 / 重物壓迫感">🪨 悶痛 / 重物壓迫感</option>
              <option value="🔥 熱熱痛 / 燒灼燙感">🔥 熱熱痛 / 燒灼燙感</option>
              <option value="🐜 麻木感 / 像螞蟻在爬">🐜 麻木感 / 像螞蟻在爬</option>
              <option value="😫 酸痛 / 肌肉非常疲憊">😫 酸痛 / 肌肉非常疲憊</option>
              <option value="⚡ 撕裂痛 / 拉扯絞痛">⚡ 撕裂痛 / 拉扯絞痛</option>
              <option value="⚡ 神經電擊痛 / 瞬間劇痛">⚡ 神經電擊痛 / 瞬間劇痛</option>
              <option value="🧊 冰冷麻痛 / 血液不順">🧊 冰冷麻痛 / 血液不順</option>
              <option value="🎈 脹痛 / 緊繃發炎感">🎈 脹痛 / 緊繃發炎感</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">疼痛頻率：</label>
            <select id="pain-freq" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-base">
              <option value="偶爾發生">偶爾發生 (斷斷續續)</option>
              <option value="陣發性 (一陣陣發作)">陣發性 (一陣陣發作)</option>
              <option value="持續不停 (一直痛)">持續不停 (一直痛)</option>
              <option value="特定動作/按壓時痛">特定動作/按壓時痛</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">服藥後改善狀況：</label>
            <select id="pain-relief" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800">
              <option value="🟢 顯著改善">🟢 顯著改善 (疼痛大減)</option>
              <option value="🟡 稍微減輕">🟡 稍微減輕 (比較舒服)</option>
              <option value="🔴 沒有改善">🔴 沒有改善 (依然很痛)</option>
            </select>
          </div>
        </div>

        <button onclick="savePainRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg py-3.5 rounded-2xl shadow-lg">
          儲存疼痛評估紀錄
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 mb-3">不適與疼痛歷史</h2>
        <div id="pain-history-list" class="flex flex-col gap-2 max-h-60 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 4. 家人共同看診行事曆頁籤 -->
    <section id="tab-cal" class="flex flex-col gap-6 hidden">
      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 border-b-2 border-emerald-100 pb-2 mb-4">新增家人看診預約</h2>
        <div class="flex flex-col gap-3 mb-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">醫院 / 診所名稱：</label>
            <input type="text" id="cal-hospital" placeholder="例：台大醫院" class="w-full border-2 border-slate-200 rounded-xl p-3 text-base font-bold">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">看診科別：</label>
              <input type="text" id="cal-dept" placeholder="例：心臟內科" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">主治醫師：</label>
              <input type="text" id="cal-doctor" placeholder="例：王醫師" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">看診日期：</label>
              <input type="date" id="cal-date" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">看診時間：</label>
              <input type="time" id="cal-time" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-sm">
            </div>
          </div>
        </div>
        <button onclick="addCalendarEvent()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg py-3 rounded-2xl shadow">
          新增看診預約
        </button>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-lg border-2 border-emerald-100">
        <h2 class="text-xl font-black text-emerald-900 mb-3">目前預約看診清單</h2>
        <div id="cal-list" class="flex flex-col gap-3"></div>
      </div>
    </section>

  </main>

  <script>
    const SHEETDB_API_URL = "https://sheetdb.io/api/v1/rd7b2ievscqzs";

    const DEFAULT_USERS = ['王爺爺', '李奶奶'];
    let currentActiveUser = '王爺爺';
    let currentInputMode = 'sys';
    let currentSlot = 'morning';
    let selectedBodyZone = '左側-頭頂/頂葉';

    window.onload = function() {
      initDefaultDateTime();
      initUserSelect();
      loadUserData();
      initChart();
    };

    function initDefaultDateTime() {
      const now = new Date();
      const currentDate = now.toISOString().split('T')[0];
      const currentTime = now.toTimeString().slice(0, 5);
      document.getElementById('bp-date-input').value = currentDate;
      document.getElementById('bp-time-input').value = currentTime;
      document.getElementById('pain-date-input').value = currentDate;
      document.getElementById('pain-time-input').value = currentTime;
      document.getElementById('cal-date').value = currentDate;
      document.getElementById('cal-time').value = "09:00";
    }

    function initUserSelect() {
      let users = JSON.parse(localStorage.getItem('bp_user_list')) || DEFAULT_USERS;
      const select = document.getElementById('user-select');
      select.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
      select.value = currentActiveUser;
    }

    function switchUser(userName) {
      currentActiveUser = userName;
      loadUserData();
    }

    function promptAddUser() {
      const name = prompt("請輸入新長輩姓名:");
      if (name && name.trim() !== "") {
        let users = JSON.parse(localStorage.getItem('bp_user_list')) || DEFAULT_USERS;
        if (!users.includes(name.trim())) {
          users.push(name.trim());
          localStorage.setItem('bp_user_list', JSON.stringify(users));
          initUserSelect();
          switchUser(name.trim());
        }
      }
    }

    function toggleElderMode() {
      const modal = document.getElementById('elder-view-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderElderLongTermView();
      }
    }

    function renderElderLongTermView() {
      const records = JSON.parse(localStorage.getItem(`bp_${currentActiveUser}`)) || [];
      const avgBox = document.getElementById('elder-avg-box');
      const list = document.getElementById('elder-history-list');

      if (records.length === 0) {
        avgBox.innerText = "目前尚無長期血壓紀錄";
        list.innerHTML = `<div class="text-gray-500 text-center py-4 text-lg">尚無紀錄</div>`;
        return;
      }

      let totalSys = records.reduce((sum, r) => sum + r.sys, 0);
      let totalDia = records.reduce((sum, r) => sum + r.dia, 0);
      let avgSys = Math.round(totalSys / records.length);
      let avgDia = Math.round(totalDia / records.length);

      avgBox.innerHTML = `平均血壓：<span class="text-amber-300 text-3xl font-black">${avgSys} / ${avgDia}</span> mmHg<br><span class="text-sm font-normal text-emerald-200">累計紀錄筆數：${records.length} 筆</span>`;

      list.innerHTML = records.map(r => `
        <div class="p-4 bg-slate-100 rounded-2xl border-2 border-emerald-200 flex justify-between items-center text-slate-800">
          <div>
            <div class="text-sm font-bold text-emerald-800">${r.date} ${r.time} (${r.slot})</div>
            <div class="text-2xl font-black text-slate-900 mt-1">${r.sys} / ${r.dia} <span class="text-sm font-normal text-slate-600">mmHg (脈搏:${r.pulse})</span></div>
          </div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      ['bp', 'med', 'pain', 'cal'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}-btn`).className = "py-2.5 font-black text-xs md:text-base rounded-xl text-emerald-700";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}-btn`).className = "py-2.5 font-black text-xs md:text-base rounded-xl bg-white text-emerald-800 shadow";
    }

    function toggleBodyView(view) {
      if (view === 'front') {
        document.getElementById('body-view-front').classList.remove('hidden');
        document.getElementById('body-view-back').classList.add('hidden');
        document.getElementById('view-front-btn').className = "flex-1 py-2.5 rounded-xl font-black bg-emerald-600 text-white shadow";
        document.getElementById('view-back-btn').className = "flex-1 py-2.5 rounded-xl font-black bg-slate-100 text-slate-700";
      } else {
        document.getElementById('body-view-back').classList.remove('hidden');
        document.getElementById('body-view-front').classList.add('hidden');
        document.getElementById('view-back-btn').className = "flex-1 py-2.5 rounded-xl font-black bg-emerald-600 text-white shadow";
        document.getElementById('view-front-btn').className = "flex-1 py-2.5 rounded-xl font-black bg-slate-100 text-slate-700";
      }
    }

    function setTimeSlot(slot) {
      currentSlot = slot;
      if (slot === 'morning') {
        document.getElementById('time-morning').className = "py-3 rounded-2xl font-black text-lg border-2 border-amber-400 bg-amber-50 text-amber-800 flex items-center justify-center gap-2";
        document.getElementById('time-evening').className = "py-3 rounded-2xl font-black text-lg border-2 border-slate-200 bg-slate-50 text-slate-600 flex items-center justify-center gap-2";
      } else {
        document.getElementById('time-evening').className = "py-3 rounded-2xl font-black text-lg border-2 border-indigo-400 bg-indigo-50 text-indigo-800 flex items-center justify-center gap-2";
        document.getElementById('time-morning').className = "py-3 rounded-2xl font-black text-lg border-2 border-slate-200 bg-slate-50 text-slate-600 flex items-center justify-center gap-2";
      }
    }

    function setActiveInput(mode) {
      currentInputMode = mode;
      document.getElementById('box-sys').className = mode === 'sys' ? "p-3 bg-red-50 border-4 border-red-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-red-50 border-2 border-red-200 rounded-2xl text-center cursor-pointer opacity-70";
      document.getElementById('box-dia').className = mode === 'dia' ? "p-3 bg-blue-50 border-4 border-blue-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-blue-50 border-2 border-blue-200 rounded-2xl text-center cursor-pointer opacity-70";
      document.getElementById('box-pulse').className = mode === 'pulse' ? "p-3 bg-rose-50 border-4 border-rose-500 rounded-2xl text-center cursor-pointer shadow-md" : "p-3 bg-rose-50 border-2 border-rose-200 rounded-2xl text-center cursor-pointer opacity-70";
    }

    function adjustVal(type, delta) {
      const el = document.getElementById(`val-${type}`);
      let val = parseInt(el.innerText) + delta;
      if (val < 30) val = 30;
      if (val > 250) val = 250;
      el.innerText = val;
    }

    function pressKey(key) {
      const el = document.getElementById(`val-${currentInputMode}`);
      let cur = el.innerText;
      if (key === 'clear') {
        el.innerText = '0';
      } else if (key === 'back') {
        el.innerText = cur.length > 1 ? cur.slice(0, -1) : '0';
      } else {
        el.innerText = cur === '0' ? String(key) : cur + key;
      }
    }

    function updatePainDisplay(score) {
      const disp = document.getElementById('pain-score-display');
      const emoji = document.getElementById('pain-emoji');
      let text = `${score} 分 `;
      if (score <= 3) { text += "(輕微)"; emoji.innerText = "😊"; }
      else if (score <= 6) { text += "(中度)"; emoji.innerText = "😐"; }
      else { text += "(劇烈)"; emoji.innerText = "😫"; }
      disp.innerText = text;
    }

    function saveBPRecord() {
      const sys = parseInt(document.getElementById('val-sys').innerText);
      const dia = parseInt(document.getElementById('val-dia').innerText);
      const pulse = parseInt(document.getElementById('val-pulse').innerText);
      const dateVal = document.getElementById('bp-date-input').value;
      const timeVal = document.getElementById('bp-time-input').value;

      const record = {
        id: Date.now(),
        date: dateVal,
        time: timeVal,
        slot: currentSlot === 'morning' ? '早上' : '晚上',
        sys, dia, pulse
      };

      let records = JSON.parse(localStorage.getItem(`bp_${currentActiveUser}`)) || [];
      records.unshift(record);
      localStorage.setItem(`bp_${currentActiveUser}`, JSON.stringify(records));

      fetch(SHEETDB_API_URL, {
        method: "POST",
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          data: [{
            "時間": `${record.date} ${record.time}`,
            "長輩": currentActiveUser,
            "收縮壓": sys,
            "舒張壓": dia,
            "脈搏": pulse,
            "時段": record.slot,
            "備註": "血壓紀錄"
          }]
        })
      }).catch(err => console.log(err));

      alert(`已成功儲存血壓紀錄！`);
      loadUserData();
    }

    function deleteBPRecord(id) {
      if (!confirm("確定要刪除這筆血壓紀錄嗎？")) return;
      let records = JSON.parse(localStorage.getItem(`bp_${currentActiveUser}`)) || [];
      records = records.filter(r => r.id !== id);
      localStorage.setItem(`bp_${currentActiveUser}`, JSON.stringify(records));
      loadUserData();
      alert("已成功刪除紀錄！");
    }

    function selectZone(zoneName) {
      selectedBodyZone = zoneName;
      document.getElementById('selected-zone-text').innerText = zoneName;
      const btns = document.querySelectorAll('.body-zone-btn');
      btns.forEach(b => {
        if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(zoneName)) {
          b.classList.add('selected');
        } else {
          b.classList.remove('selected');
        }
      });
    }

    function savePainRecord() {
      const dateVal = document.getElementById('pain-date-input').value;
      const timeVal = document.getElementById('pain-time-input').value;
      const score = document.getElementById('pain-score').value;
      const type = document.getElementById('pain-type').value;
      const freq = document.getElementById('pain-freq').value;
      const relief = document.getElementById('pain-relief').value;

      const painRec = {
        id: Date.now(),
        date: dateVal,
        time: timeVal,
        part: selectedBodyZone,
        score, type, freq, relief
      };

      let pains = JSON.parse(localStorage.getItem(`pain_${currentActiveUser}`)) || [];
      pains.unshift(painRec);
      localStorage.setItem(`pain_${currentActiveUser}`, JSON.stringify(pains));

      fetch(SHEETDB_API_URL, {
        method: "POST",
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          data: [{
            "時間": `${painRec.date} ${painRec.time}`,
            "長輩": currentActiveUser,
            "收縮壓": 0, "舒張壓": 0, "脈搏": 0,
            "時段": "疼痛紀錄",
            "備註": `部位:${painRec.part}, ${painRec.score}分(${painRec.type}), 頻率:${painRec.freq}, 改善:${painRec.relief}`
          }]
        })
      }).catch(err => console.log(err));

      alert("已成功儲存疼痛紀錄！");
      loadUserData();
    }

    function addMedication() {
      const name = document.getElementById('med-name').value.trim();
      const time = document.getElementById('med-time').value;
      const note = document.getElementById('med-note').value.trim();
      if (!name) { alert("請輸入藥物名稱！"); return; }
      
      let meds = JSON.parse(localStorage.getItem(`med_${currentActiveUser}`)) || [];
      meds.push({ id: Date.now(), name, time, note });
      localStorage.setItem(`med_${currentActiveUser}`, JSON.stringify(meds));
      document.getElementById('med-name').value = '';
      document.getElementById('med-note').value = '';
      alert("成功新增用藥提醒！");
      loadUserData();
    }

    function addCalendarEvent() {
      const hospital = document.getElementById('cal-hospital').value.trim();
      const dept = document.getElementById('cal-dept').value.trim();
      const doctor = document.getElementById('cal-doctor').value.trim();
      const date = document.getElementById('cal-date').value;
      const time = document.getElementById('cal-time').value;

      if (!hospital) { alert("請輸入醫院或診所名稱！"); return; }

      const calItem = { id: Date.now(), hospital, dept, doctor, date, time };
      let cals = JSON.parse(localStorage.getItem(`cal_${currentActiveUser}`)) || [];
      cals.unshift(calItem);
      localStorage.setItem(`cal_${currentActiveUser}`, JSON.stringify(cals));

      fetch(SHEETDB_API_URL, {
        method: "POST",
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          data: [{
            "時間": `${date} ${time}`,
            "長輩": currentActiveUser,
            "收縮壓": 0, "舒張壓": 0, "脈搏": 0,
            "時段": "看診行事曆",
            "備註": `醫院:${hospital}(${dept}/${doctor})`
          }]
        })
      }).catch(err => console.log(err));

      document.getElementById('cal-hospital').value = '';
      document.getElementById('cal-dept').value = '';
      document.getElementById('cal-doctor').value = '';
      alert("成功新增看診預約！");
      loadUserData();
    }

    function loadUserData() {
      const bpRecords = JSON.parse(localStorage.getItem(`bp_${currentActiveUser}`)) || [];
      const bpList = document.getElementById('bp-history-list');
      bpList.innerHTML = bpRecords.length === 0 ? '<div class="text-gray-400 text-center py-2">尚無血壓紀錄</div>' : bpRecords.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border">
          <div>
            <span class="text-xs font-bold text-emerald-700">${r.date} ${r.time} (${r.slot})</span>
            <div class="text-lg font-black text-slate-800">
              ${r.sys} / ${r.dia} mmHg <span class="text-xs text-slate-500 font-normal">(脈搏:${r.pulse})</span>
            </div>
          </div>
          <button onclick="deleteBPRecord(${r.id})" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-200">刪除</button>
        </div>
      `).join('');

      const meds = JSON.parse(localStorage.getItem(`med_${currentActiveUser}`)) || [];
      const medList = document.getElementById('med-list');
      medList.innerHTML = meds.length === 0 ? '<div class="text-gray-400 text-center py-2">尚無用藥提醒</div>' : meds.map(m => `
        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200">
          <span class="bg-emerald-600 text-white text-xs font-bold px-2 py-0.5 rounded-full">${m.time}</span>
          <div class="font-black text-emerald-950 text-base mt-1">${m.name}</div>
          <div class="text-xs text-emerald-700 font-bold mt-0.5">${m.note || ''}</div>
        </div>
      `).join('');

      const pains = JSON.parse(localStorage.getItem(`pain_${currentActiveUser}`)) || [];
      const painList = document.getElementById('pain-history-list');
      painList.innerHTML = pains.length === 0 ? '<div class="text-gray-400 text-center py-2">尚無疼痛紀錄</div>' : pains.map(p => `
        <div class="p-3 bg-slate-50 rounded-xl border flex flex-col gap-1">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-500">${p.date} ${p.time}</span>
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700">${p.part}</span>
          </div>
          <div class="font-black text-slate-800 text-sm">疼痛：${p.score}分 (${p.type}) - 頻率：${p.freq}</div>
          <div class="text-xs font-bold text-indigo-700">改善狀況：${p.relief}</div>
        </div>
      `).join('');

      const cals = JSON.parse(localStorage.getItem(`cal_${currentActiveUser}`)) || [];
      const calList = document.getElementById('cal-list');
      calList.innerHTML = cals.length === 0 ? '<div class="text-gray-400 text-center py-2">尚無看診預約</div>' : cals.map(c => `
        <div class="p-3.5 bg-indigo-50 rounded-2xl border border-indigo-200 flex flex-col gap-1">
          <div class="flex justify-between items-center">
            <span class="text-xs font-black text-indigo-800 bg-indigo-100 px-2 py-0.5 rounded-full">${c.date} ${c.time}</span>
            <span class="text-xs font-bold text-slate-600">${c.dept || ''} ${c.doctor ? c.doctor+'醫師' : ''}</span>
          </div>
          <div class="font-black text-indigo-950 text-base mt-1">${c.hospital}</div>
        </div>
      `).join('');

      updateChart(bpRecords);
    }

    let bpChart;
    function initChart() {
      const ctx = document.getElementById('bpChart').getContext('2d');
      bpChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function updateChart(records) {
      if (!bpChart) return;
      const recent = [...records].reverse().slice(-7);
      bpChart.data.labels = recent.map(r => `${r.date} ${r.slot}`);
      bpChart.data.datasets = [
        { label: '收縮壓', data: recent.map(r => r.sys), borderColor: '#ef4444', backgroundColor: '#ef444420', fill: false, tension: 0.2 },
        { label: '舒張壓', data: recent.map(r => r.dia), borderColor: '#3b82f6', backgroundColor: '#3b82f620', fill: false, tension: 0.2 }
      ];
      bpChart.update();
    }
  </script>
</body>
</html>
